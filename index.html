<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temporada</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Temporada">
<meta name="theme-color" content="#15432E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --surface-2:#F5F7F4; --ink:#12201A; --muted:#5B6961; --line:#D3DAD2;
  --brand:#15432E; --brand-2:#1D5A3E; --on-brand:#F1F5F0; --on-brand-muted:#B4C8BA;
  --c-gym:#2F7A55; --c-rugby:#1E4F7A; --c-speed:#C9621F; --c-z2:#23879B; --c-mob:#7A8270;
  --c-match:#B8322A; --c-eng:#6E4FA6; --c-cera:#9A6810; --c-corr:#2A66C8; --c-check:#5E6A73; --c-trip:#2F8C86;
  --warn-bg:#FBF1DC; --warn-ink:#6B4A06;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#16201B; --surface-2:#1B2721; --ink:#E4EBE6; --muted:#98A69E; --line:#27352D;
    --brand:#123826; --brand-2:#1A4A33; --on-brand:#EAF1EC; --on-brand-muted:#97B2A1;
    --c-gym:#52A67D; --c-rugby:#5E92C4; --c-speed:#E8864A; --c-z2:#4EB1C5; --c-mob:#A0A893;
    --c-match:#E25A50; --c-eng:#A085D8; --c-cera:#D39E3E; --c-corr:#6497EC; --c-check:#8D99A2; --c-trip:#5FB6AF;
    --warn-bg:#3A2F16; --warn-ink:#F0D9A4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --surface-2:#1B2721; --ink:#E4EBE6; --muted:#98A69E; --line:#27352D;
  --brand:#123826; --brand-2:#1A4A33; --on-brand:#EAF1EC; --on-brand-muted:#97B2A1;
  --c-gym:#52A67D; --c-rugby:#5E92C4; --c-speed:#E8864A; --c-z2:#4EB1C5; --c-mob:#A0A893;
  --c-match:#E25A50; --c-eng:#A085D8; --c-cera:#D39E3E; --c-corr:#6497EC; --c-check:#8D99A2; --c-trip:#5FB6AF;
  --warn-bg:#3A2F16; --warn-ink:#F0D9A4;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--brand);}
html,body{min-height:100%;margin:0;}
body{min-height:100vh;min-height:100dvh;}
*,*::before,*::after{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--c-corr);outline-offset:2px;}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:84px;}

/* ---------- Board (header de la semana) ---------- */
.board{background:var(--brand);color:var(--on-brand);padding:18px 18px 16px;position:relative;overflow:hidden;}
.board::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(90deg,var(--on-brand) 0 22px,transparent 22px 34px);opacity:.35;}
.board-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--on-brand-muted);}
.phase{font-family:var(--display);font-weight:600;font-size:17px;color:var(--on-brand);letter-spacing:.2px;}
.sync{font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--on-brand-muted);display:inline-block;}
.sync.cloud i{background:#7FD3A5;}
.next{margin-top:14px;}
.next-l{font-size:14px;color:var(--on-brand-muted);}
.next-teams{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.02;margin:2px 0 6px;letter-spacing:-.2px;}
.next-teams .vs{font-weight:500;color:var(--on-brand-muted);font-size:26px;padding:0 4px;}
.next-meta{font-size:15px;}
.next-meta b{font-weight:600;}
.cera-line{margin-top:8px;font-size:14px;color:var(--on-brand-muted);}
.prog{margin-top:16px;}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden;}
.bar i{display:block;height:100%;background:var(--on-brand);border-radius:4px;transition:width .35s ease;}
.prog-l{display:flex;justify-content:space-between;margin-top:6px;font-size:14px;color:var(--on-brand-muted);}
.prog-l b{color:var(--on-brand);font-weight:600;}

/* ---------- Tira de la semana ---------- */
.weeknav{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 6px;}
.weeknav h2{margin:0;font-family:var(--display);font-weight:600;font-size:20px;}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;}
.iconbtn:disabled{opacity:.35;cursor:default;}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:4px 10px 10px;}
.day{border:0;background:transparent;border-radius:12px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.day .dl{font-size:13px;color:var(--muted);}
.day .ring{position:relative;width:40px;height:40px;}
.day .ring svg{position:absolute;inset:0;transform:rotate(-90deg);}
.day .ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:18px;}
.day.sel{background:var(--surface);box-shadow:0 0 0 1px var(--line);}
.day.today .dl{color:var(--ink);font-weight:600;}
.day .mk{height:5px;display:flex;gap:3px;}
.day .mk b{width:5px;height:5px;border-radius:50%;}

/* ---------- Día y tareas ---------- */
.dayhead{padding:6px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.dayhead h3{margin:0;font-family:var(--display);font-size:24px;font-weight:700;}
.dayhead .cnt{font-size:14px;color:var(--muted);white-space:nowrap;}
.check{display:flex;align-items:center;gap:10px;font-size:15px;margin:2px 0 6px;}
.check input{width:20px;height:20px;accent-color:var(--c-cera);}
.banner{margin:0 12px 10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border-left:4px solid var(--c-trip);font-size:14.5px;}
.banner b{font-weight:600;}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink);border-left-color:var(--c-cera);}
.list{padding:0 12px;display:flex;flex-direction:column;gap:8px;}
.task{background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);overflow:hidden;}
.trow{display:flex;align-items:stretch;min-height:64px;}
.trow::before{content:"";width:5px;background:var(--c);flex:none;}
.chk{flex:none;width:58px;border:0;background:transparent;display:grid;place-items:center;}
.chk span{width:28px;height:28px;border-radius:8px;border:2px solid var(--c);display:grid;place-items:center;transition:background .15s ease;}
.chk svg{opacity:0;transition:opacity .15s ease;}
.task.done .chk span{background:var(--c);}
.task.done .chk svg{opacity:1;}
.tbody{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:10px 4px 10px 0;display:flex;flex-direction:column;justify-content:center;}
.tline{display:flex;align-items:baseline;gap:8px;}
.ttime{font-family:var(--display);font-weight:600;font-size:17px;color:var(--c);min-width:42px;}
.ttitle{font-weight:600;font-size:16.5px;}
.task.done .ttitle{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted);}
.tsub{font-size:14px;color:var(--muted);margin-top:1px;}
.tsub em{font-style:normal;color:var(--c);font-weight:500;}
.more{flex:none;width:42px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);}
.more svg{transition:transform .2s ease;}
.task.open .more svg{transform:rotate(180deg);}
.tdetail{display:none;padding:2px 14px 14px 63px;font-size:14.5px;}
.task.open .tdetail{display:block;}
.tdetail p{margin:6px 0;}
.tdetail .note{padding:8px 10px;border-radius:10px;background:var(--surface-2);margin:8px 0;}
.clock{width:100%;border-collapse:collapse;margin:6px 0;}
.clock td{padding:5px 6px 5px 0;vertical-align:top;border-bottom:1px solid var(--line);}
.clock tr:last-child td{border-bottom:0;}
.clock td:first-child{font-family:var(--display);font-weight:600;color:var(--c);width:48px;white-space:nowrap;}
.clock td:last-child{color:var(--muted);font-size:13.5px;}
.task.info .trow{min-height:52px;}
.task.info .chk{visibility:hidden;}
.inline-form{display:flex;gap:8px;margin-top:8px;}
.inline-form input{flex:1;min-width:0;}
textarea{width:100%;min-height:64px;resize:vertical;}

/* ---------- Dieta ---------- */
.diet{margin:14px 12px 0;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);overflow:hidden;}
.diet-head{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:14px 14px 12px;text-align:left;}
.diet-head .dh{flex:1;min-width:0;}
.diet-head h4{margin:0;font-family:var(--display);font-size:20px;font-weight:600;}
.diet-head .ds{font-size:14px;color:var(--muted);}
.diet-head .kc{font-family:var(--display);font-weight:700;font-size:24px;white-space:nowrap;}
.diet-head .kc small{font-size:14px;font-weight:500;color:var(--muted);}
.diet-head svg{color:var(--muted);transition:transform .2s ease;flex:none;}
.diet.open .diet-head svg{transform:rotate(180deg);}
.diet-body{display:none;padding:0 14px 14px;}
.diet.open .diet-body{display:block;}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px;}
.macros div{background:var(--surface-2);border-radius:10px;padding:8px 10px;}
.macros b{display:block;font-family:var(--display);font-size:20px;font-weight:700;}
.macros span{font-size:13px;color:var(--muted);}
.dnote{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--surface-2);margin:0 0 8px;}
.meal{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);}
.meal .mchk{flex:none;width:36px;height:36px;margin-top:-4px;border:0;background:transparent;display:grid;place-items:center;}
.meal .mchk span{width:22px;height:22px;border-radius:6px;border:2px solid var(--c-gym);display:grid;place-items:center;}
.meal .mchk svg{opacity:0;width:13px;height:13px;}
.meal.done .mchk span{background:var(--c-gym);}
.meal.done .mchk svg{opacity:1;}
.meal .mt{font-family:var(--display);font-weight:600;font-size:16px;color:var(--c-gym);min-width:42px;}
.meal .mb{flex:1;min-width:0;}
.meal .mn{font-weight:600;font-size:15px;}
.meal.done .mn{color:var(--muted);text-decoration:line-through;}
.meal .mf{font-size:14.5px;}
.meal .mm{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;}

/* ---------- Resumen semanal ---------- */
.summary{margin:16px 12px 0;padding:14px;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);}
.summary h4{margin:0 0 10px;font-family:var(--display);font-size:18px;font-weight:600;}
.srow{display:grid;grid-template-columns:92px 1fr 52px;gap:10px;align-items:center;margin:8px 0;font-size:14.5px;}
.srow .sbar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);}
.srow .sbar i{display:block;height:100%;background:var(--c);}
.srow .sn{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;}

/* ---------- Vistas secundarias ---------- */
.pagehead{background:var(--brand);color:var(--on-brand);padding:18px 18px 16px;position:relative;}
.pagehead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(90deg,var(--on-brand) 0 22px,transparent 22px 34px);opacity:.35;}
.pagehead h1{margin:0;font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05;}
.pagehead p{margin:6px 0 0;color:var(--on-brand-muted);font-size:14.5px;max-width:60ch;}
.section{margin:14px 12px;padding:14px;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);}
.section h3{margin:0 0 10px;font-family:var(--display);font-weight:600;font-size:20px;}
.section p{margin:6px 0;font-size:14.5px;color:var(--muted);}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0;}
.field label{font-size:14px;color:var(--muted);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 11px;min-height:44px;width:100%;}
.btn{border:0;border-radius:12px;min-height:46px;padding:0 18px;background:var(--brand-2);color:var(--on-brand);font-weight:600;}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);}
.btn.danger{background:transparent;color:var(--c-match);box-shadow:inset 0 0 0 1px var(--c-match);}
.btn.small{min-height:38px;padding:0 12px;font-size:14px;}
.btn.full{width:100%;margin-top:6px;}
.err{color:var(--c-match);font-size:14px;margin-top:6px;}
.tripitem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);}
.tripitem:first-of-type{border-top:0;}
.tripitem .tb{flex:1;min-width:0;}
.tripitem .tt{font-weight:600;}
.tripitem .td{font-size:14px;color:var(--muted);}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c-trip);margin-top:6px;flex:none;}
.fix{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line);}
.fix:first-of-type{border-top:0;}
.fix .jn{font-family:var(--display);font-weight:700;font-size:22px;color:var(--muted);}
.fix.next .jn{color:var(--c-match);}
.fix .fr{font-weight:600;}
.fix .fm{font-size:14px;color:var(--muted);margin-bottom:6px;}
.fix.bye .fr{color:var(--muted);font-weight:500;}
.fix.past{opacity:.6;}
.chart{width:100%;height:auto;display:block;margin:6px 0 4px;}
.wlist{font-variant-numeric:tabular-nums;}
.wlist div{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px;}
.wlist div:first-child{border-top:0;}
.good{color:var(--c-gym);} .bad{color:var(--c-match);}
.hint{font-size:14px;color:var(--muted);}
.empty{padding:24px 18px;text-align:center;color:var(--muted);}

/* ---------- Pestañas ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10;}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);}
.tab{border:0;background:transparent;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);}
.tab.on{color:var(--ink);font-weight:600;}
.tab.on svg{color:var(--brand-2);}
:root[data-theme="dark"] .tab.on svg{color:var(--c-gym);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab.on svg{color:var(--c-gym);}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.toast.show{opacity:1;}
@media (prefers-reduced-motion: reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
</div>
<nav id="tabs" aria-label="Secciones"><div class="in" id="tabsin"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/*LOGIC_START*/
const START = '2026-09-28';
const TRAIN_LAST = '2027-07-04';   /* último día con entreno: fin de la temporada */
const LAST_WEEK = '2028-10-09';    /* última semana del plan CERA */
const SEASON_END = '2027-03-21';
const DELOAD_WEEKS = ['2026-11-09','2026-12-21','2027-02-08'];
const DOW_L = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DOW_S = ['L','M','X','J','V','S','D'];
const MON = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MON_S = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const pad = n => String(n).padStart(2,'0');
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parse(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function dow(s){ return (parse(s).getDay()+6)%7; }
function mondayOf(s){ return addDays(s,-dow(s)); }
function diffDays(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
function longDate(s){ const d=parse(s); return DOW_L[dow(s)]+' '+d.getDate()+' de '+MON[d.getMonth()]; }
function shortDate(s){ const d=parse(s); return d.getDate()+' '+MON_S[d.getMonth()]; }
function addMin(t,m){ const [h,mm]=t.split(':').map(Number); let x=h*60+mm+m; x=((x%1440)+1440)%1440; return pad(Math.floor(x/60))+':'+pad(x%60); }

const FIXTURES = [
  {j:1, d:'2026-10-17', rival:'La Unica', casa:true},
  {j:2, d:'2026-10-24', rival:'Gaztedi', casa:false},
  {j:3, d:'2026-11-07', rival:'Zaisa Txingudi', casa:true},
  {j:4, d:'2026-11-14', bye:true},
  {j:5, d:'2026-11-28', rival:'Iruña', casa:false},
  {j:6, d:'2026-12-12', rival:'Durango Mutriku', casa:true},
  {j:7, d:'2026-12-19', rival:'Zornotza Urgozo', casa:false},
  {j:8, d:'2027-01-16', rival:'La Unica', casa:false},
  {j:9, d:'2027-01-23', rival:'Gaztedi', casa:true},
  {j:10,d:'2027-02-06', rival:'Zaisa Txingudi', casa:false},
  {j:11,d:'2027-02-13', bye:true},
  {j:12,d:'2027-02-27', rival:'Iruña', casa:true},
  {j:13,d:'2027-03-13', rival:'Durango Mutriku', casa:false, dudosa:true},
  {j:14,d:'2027-03-20', rival:'Zornotza Urgozo', casa:true}
];

function ceraWeek(date){ return CERA_WEEKS[mondayOf(date)] || null; }
function ceraPhase(date){ const w=ceraWeek(date); return w ? CERA_PH[w.p] : null; }
function ceraMinutes(mon, state){
  const s=state.settings||{};
  if(s.ceraAuto===false) return Math.max(0, Number(s.cera)||0);
  const w=CERA_WEEKS[mon]; return w ? w.m : 0;
}
function nextMile(){
  const from = TODAY<START?START:TODAY;
  return CERA_MILES.filter(m=>m.d>=from).sort((a,b)=>a.d<b.d?-1:1)[0]||null;
}
function milesOn(date){ return CERA_MILES.filter(m=>m.d===date); }
function mileWarn(date){
  return CERA_MILES.filter(m=>m.k==='insc' && m.d>date && diffDays(date,m.d)<=m.w).sort((a,b)=>a.d<b.d?-1:1)[0]||null;
}

function fixtureList(state){
  return FIXTURES.map(f=>{ const ov=(state.fixtures||{})['J'+f.j]||{}; return Object.assign({},f,{d:ov.d||f.d, ko:ov.ko||''}); });
}
function fixtureMap(state){ const m={}; for(const f of fixtureList(state)) m[f.d]=f; return m; }

function phaseOf(date){
  const mon=mondayOf(date);
  if(date<START) return 'antes';
  if(mon==='2026-09-28') return 'vuelta';
  if(mon==='2026-10-05') return 'pretemporada';
  if(mon==='2026-10-12') return 'afinado';
  if(DELOAD_WEEKS.includes(mon)) return 'descarga';
  if(date>SEASON_END) return 'finliga';
  return 'liga';
}

function tripOn(date,state){
  let best=null;
  for(const t of (state.trips||[])){
    if(t.from<=date && date<=t.to){ if(!best || TRIP_PRI[t.type]>TRIP_PRI[best.type]) best=t; }
  }
  return best;
}

function allocate(target, slots){
  const out=slots.map(()=>0); let rem=target; let open=slots.map((_,i)=>i);
  let guard=0;
  while(rem>0.5 && open.length && guard++<20){
    const W=open.reduce((a,i)=>a+slots[i].w,0);
    const next=[]; let used=0; let capped=false;
    for(const i of open){
      const share=rem*slots[i].w/W;
      if(out[i]+share>=slots[i].cap){ used+=slots[i].cap-out[i]; out[i]=slots[i].cap; capped=true; }
      else next.push(i);
    }
    if(!capped){ for(const i of open) out[i]+=rem*slots[i].w/W; rem=0; break; }
    rem-=used; open=next;
  }
  let left=Math.max(0,rem);
  const mins=out.map(m=>{ const r=Math.round(m/5)*5; if(r<15){ left+=m; return 0; } return r; });
  return {mins, left:Math.round(left/5)*5};
}

function speedPlan(phase,date){
  if(phase==='vuelta') return '4 progresiones de 30 m al 75-85 %. Sin sprints máximos ni lanzados.';
  if(phase==='pretemporada') return '6 × 20 m de aceleración desde salida a 3 apoyos, 2-3 min de descanso.';

  if(date<'2026-11-23') return '5 × 20 m de aceleración + 2 × 20 m lanzado (entrada de 15 m), 3-4 min de descanso.';
  return '4 × 20 m + 3 × 20 m lanzado + 2 × 20 m en cuesta suave (sustituye al trineo), 3-4 min de descanso.';
}

/* Sesiones perdidas por viaje o enfermedad justo antes: modifica el gimnasio */
function returnMod(date,state){
  for(const t of (state.trips||[])){
    if(!['esqui','vacaciones','enfermo'].includes(t.type)) continue;
    if(diffDays(t.from,t.to)<2) continue;
    if(!(t.to<date)) continue;
    const gap=diffDays(t.to,date);
    if(gap>10) continue;
    let gymDays=0;
    for(let d=addDays(t.to,1); d<date; d=addDays(d,1)){
      if(dow(d)<=3){ const tr=tripOn(d,state); if(!(tr && TRIP_TYPES[tr.type].blocks)) gymDays++; }
    }
    if(gymDays<2) return t.type;
  }
  return null;
}

function buildWeek(mon,state){
  const dates=[0,1,2,3,4,5,6].map(i=>addDays(mon,i));
  const fx=fixtureMap(state);
  const days={}; dates.forEach(d=>days[d]=[]);
  const trip={}; dates.forEach(d=>trip[d]=tripOn(d,state));
  const active=d=>d>=START;
  const train=d=>d>=START && d<=TRAIN_LAST;
  const blocked=d=>!!(trip[d] && TRIP_TYPES[trip[d].type].blocks);
  const push=(d,t)=>{ t.key=d+'|'+t.id; if(t.count===undefined) t.count=true; days[d].push(t); };
  const sat=dates[5], satFx=fx[sat];
  const satHasFixture=!!(satFx && !satFx.bye);
  const satPlays=satHasFixture && !blocked(sat) && train(sat);

  /* --- Gimnasio y replanificación --- */
  const DEF={0:'A',1:'B',2:'C',3:'D'};
  const gymPlan={}; const lost=[];
  for(let i=0;i<4;i++){
    const d=dates[i]; if(!train(d)) continue;
    if(blocked(d)){ if(DEF[i]!=='D') lost.push(DEF[i]); }
    else gymPlan[d]={k:DEF[i]};
  }
  const PRIO=['A','C','B'];
  lost.sort((a,b)=>PRIO.indexOf(a)-PRIO.indexOf(b));
  const thu=dates[3], fri=dates[4];
  if(gymPlan[thu] && lost.length){
    const allowed=satPlays?['B']:['A','C','B'];
    const pick=lost.find(k=>allowed.includes(k));
    if(pick){ gymPlan[thu]={k:pick, rec:'Recuperada del '+GYM[pick].day+'. Sustituye al gimnasio D.'}; lost.splice(lost.indexOf(pick),1); }
  }
  if(lost.length && train(fri) && !blocked(fri) && !satPlays && phaseOf(fri)!=='vuelta'){
    const k=lost.shift(); gymPlan[fri]={k, rec:'Recuperada del '+GYM[k].day+': hoy no hay partido mañana.'};
  }
  const lostNote = lost.length ? 'Esta semana no se recupera: '+lost.map(k=>GYM[k].name).join(' y ')+'. No se amontonan sesiones.' : '';

  for(const d of dates){
    if(!gymPlan[d]) continue;
    const g=GYM[gymPlan[d].k]; const ph=phaseOf(d);
    const mods=[]; if(GYM_MOD[ph]) mods.push(GYM_MOD[ph]);
    const rm=returnMod(d,state);
    if(rm==='enfermo') mods.unshift('Vuelta tras estar enfermo: todo al 60-70 %.');
    else if(rm) mods.unshift('Vuelta de viaje: una serie menos por ejercicio.');

    push(d,{id:'gym', cat:'gym', t:'14:20', title:g.name, sub:g.what+'. Hasta las '+g.end+'.',

      detail:{type:'gym', k:gymPlan[d].k, mods}});
  }

  /* --- Velocidad --- */
  const wed=dates[2]; let speedLost=false;
  if(train(wed)){
    if(blocked(wed)) speedLost=true;
    else push(wed,{id:'speed', cat:'speed', t:'18:30', title:'Velocidad', sub:'Al aire libre, 45 min. Hasta las 19:15.', detail:{type:'speed', plan:speedPlan(phaseOf(wed),wed)}});

  /* --- Rugby de campo --- */
  for(const i of [0,1,3]){
    const d=dates[i]; if(!train(d)) continue;
    const tr=trip[d];
    if(tr && tr.type==='paron'){ push(d,{id:'z2', cat:'z2', t:'19:00', title:'Zona 2, 30 min', sub:'Sustituye al entreno de campo (parón del club).', detail:{type:'z2', extra:''}}); continue; }

  /* --- Viernes --- */

    const ph=phaseOf(fri); const tr=trip[fri];

      const f=satFx; const title='Partido, jornada '+f.j;

    else if(tr.type==='trabajo') push(sun,{id:'z2', cat:'z2', t:'', title:'Caminar 45 min a ritmo vivo', sub:'Sustituye a la Zona 2 durante el viaje.', detail:{type:'z2', extra:''}});
  }

  /* --- Tareas propias del viaje --- */
  for(const d of dates){
    if(!active(d)) continue; const tr=trip[d]; if(!tr) continue;
    if(tr.type==='esqui') push(d,{id:'ski', cat:'trip', t:'', title:'Esquí', sub:'Cuenta como Zona 2 y piernas.', detail:{type:'text', html:'<p>Proteína igual que en casa y bebe más de lo que crees: en altura se deshidrata uno sin notarlo.</p>'}});
    else if(tr.type==='vacaciones') push(d,{id:'activ', cat:'trip', t:'', title:'Caminar o monte, 45-60 min', sub:'Actividad suave diaria.', detail:{type:'text', html:'<p>Sin intensidad. Es para mantener el hábito y la Zona 2.</p>'}});
    else if(tr.type==='trabajo' && dow(d)<=3) push(d,{id:'hotel', cat:'gym', t:'', title:'Circuito de hotel, 30 min', sub:'Sustituye al gimnasio durante el viaje.', detail:{type:'hotel'}});
    else if(tr.type==='enfermo') push(d,{id:'info-sick', cat:'check', t:'', title:'Sin entrenamiento', sub:'Descansa. Si has tenido fiebre, espera a estar sin ella antes de volver.', count:false, detail:{type:'text', html:'<p>Al volver, el gimnasio marcará las dos primeras sesiones al 60-70 %.</p>'}});
  }

  /* --- Movilidad, pesaje, revisión --- */
  const MOB_T=['22:15','22:15','22:00','22:15','21:30','21:30','12:00'];
  for(const d of dates){
    if(!active(d)) continue; const tr=trip[d]; const i=dow(d);
    const sick=tr&&tr.type==='enfermo';
    if(train(d) || dow(d)===6) push(d,{id:'mob', cat:'mob', t:tr&&tr.type==='esqui'?'21:00':MOB_T[i], title: sick?'Movilidad suave, 10 min':(i===6?'Movilidad, 20 min':'Movilidad, 10 min'), sub:'Rutina diaria.', detail:{type:'mob'}});
    const weighDays = phaseOf(d)==='vuelta' ? [0,1,2] : [1,3,4];
    if(train(d) && weighDays.includes(i) && (!tr || tr.type==='paron')) push(d,{id:'weigh', cat:'check', t:'07:00', title:'Pesaje en ayunas', sub:'Después de orinar y antes de beber.', detail:{type:'weigh', date:d}});
    if(i===6 && (!tr || tr.type==='paron' || tr.type==='trabajo')) push(d,{id:'review', cat:'check', t:'21:00', title:'Revisión semanal, 15 min', sub:'Viajes de la semana que viene, peso medio y tareas de estudio.', detail:{type:'review'}});
  }

  /* --- Estudio con reparto automático --- */
  const left={};
  const set=state.settings||{};
  for(const area of ['eng','cera','corr']){
    const target = area==='cera' ? ceraMinutes(mon,state) : Math.max(0,Number(set[area])||0);
    const sl=SLOTS.filter(s=>s.area===area).map(s=>{
      const date=dates[s.dow];
      return Object.assign({},s,{date, cap:(date>TRAIN_LAST && s.capPost!=null) ? s.capPost : s.cap});
    }).filter(s=>{
      if(!active(s.date) || !s.cap) return false;
      const tr=trip[s.date];
      if(tr && !TRIP_TYPES[tr.type].study.includes(area)) return false;
      if(s.noMatch && satHasFixture && !blocked(sat)) return false;
      return true;
    });
    if(!target) continue;
    if(!sl.length){ left[area]=target; continue; }
    const r=allocate(target,sl);
    if(r.left>0) left[area]=r.left;
    sl.forEach((s,i)=>{
      const m=r.mins[i]; if(!m) return;
      const ph=phaseOf(s.date);
      let t=s.t;
      if(s.tPost && s.date>TRAIN_LAST) t=s.tPost;
      else if(s.tPre && (ph==='vuelta'||ph==='pretemporada')) t=s.tPre;
      const cw = area==='cera' ? ceraWeek(s.date) : null;
      push(s.date,{id:area, cat:area, t, title:cw?('CERA · '+CERA_PH[cw.p].name.split(':')[0]):AREA[area].name,
        sub:m+' min, hasta las '+addMin(t,m)+'.'+(cw?' '+cw.t+'.':''), detail:{type:'study', area, mon:mondayOf(s.date)}});
    });
  }

  /* --- Hitos del plan CERA --- */
  for(const d of dates){
    if(d<START) continue;
    for(const m of milesOn(d)){
      push(d,{id:m.id, cat:'cera', t:'', title:m.t, sub:MILE_K[m.k]+'. '+m.s, count:m.k!=='exam',
        detail:{type:'text', html:'<p>'+esc(m.s)+'</p>'+(m.k==='insc'?'<p class="hint">El plazo de inscripción a examen cierra el jueves cuatro semanas antes, y hay que adjuntar el justificante del seminario.</p>':'')}});
    }
  }

  const SORTK={match:'11:00', recov:'13:00', ski:'09:00', activ:'10:00', hotel:'07:30'};
  const sk=t=> t.t || SORTK[t.id] || (t.count?'23:59':'00:00');
  for(const d of dates) days[d].sort((a,b)=>{ const x=sk(a), y=sk(b); return x<y?-1:x>y?1:0; });
  return {dates, days, trip, left, lostNote, fx};
}

function dietFor(date, W){
  if(date<START || date>TRAIN_LAST) return null;
  const tr=W.trip[date]; const i=dow(date); const lvl=dietLevel(date); const ph=phaseOf(date);
  const sat=W.dates[5]; const satFx=W.fx[sat];
  const satBlocked=!!(W.trip[sat] && TRIP_TYPES[W.trip[sat].type].blocks);
  const satPlays=!!(satFx && !satFx.bye) && !satBlocked;
  const notes=[];
  let kind, name;
  if(tr && tr.type==='enfermo') return {kind:'enfermo', name:'Día de recuperación', rows:[], notes:['Hoy no hay déficit ni se cuentan calorías. Come según el hambre, con proteína en cada comida (unos 200 g al día), mucho líquido, caldo, fruta, arroz o patata.']};
  if(tr && tr.type==='esqui'){ kind='esqui'; name='Día de esquí'; notes.push('Mucho gasto: hoy se come como un día fuerte. Bebe más de lo que crees; en altura te deshidratas sin notarlo.'); }
  else if(tr && tr.type==='vacaciones'){ kind='domingo'; name='Día de vacaciones'; notes.push('Fuera de casa: proteína en cada comida y guarnición de arroz o patata. Los horarios son orientativos.'); }
  else if(tr && tr.type==='trabajo'){ kind='libre'; name='Día de viaje'; notes.push('En restaurante: proteína a la plancha, arroz o patata y verdura. Los lácteos de la noche, en el hotel si puedes.'); }
  else if(i===0||i===1||i===3){ if(tr && tr.type==='paron'){ kind='miercoles'; name='Día de gimnasio sin campo'; } else { kind='doble'; name='Día doble'; } }
  else if(i===2){ kind='miercoles'; name='Gimnasio y velocidad'; }
  else if(i===4){ if(satPlays){ kind='viernes'; name='Víspera de partido'; notes.push('El viernes no es día bajo: rellenas el glucógeno para mañana. Fibra al mínimo, nada de legumbres ni crucíferas.'); } else { kind='domingo'; name='Descanso'; } }
  else if(i===5){ if(satPlays){ kind='partido'; name='Día de partido'; if(!satFx.ko) notes.push('Horas calculadas para un saque a las 16:00. Pon la hora real en Liga y se ajustan solas.'); } else { kind='libre'; name='Sábado sin partido'; } }
  else { kind='domingo'; name='Zona 2 y recuperación'; }
  const PHN={vuelta:'Semana de vuelta: comes unas 300 kcal más que en pretemporada.', pretemporada:'Pretemporada: déficit alto, en torno a 850 kcal al día.', afinado:'Afinado: déficit reducido para llegar lleno al debut.', liga:'Liga: déficit moderado, en torno a 500 kcal al día.', finliga:'Déficit moderado, en torno a 500 kcal al día.', descarga:'Descarga: come a mantenimiento. Añade una ración extra de arroz, patata o pan en la comida y en la cena.'};
  if(PHN[ph]) notes.unshift(PHN[ph]);
  const rows=dietRows(kind, lvl, satFx && satFx.ko);
  return {kind, name, rows, notes};
}
function dietTotals(rows){
  let P=0,C=0,G=0; for(const r of rows){ P+=r[3]; C+=r[4]; G+=r[5]; }
  return {P,C,G,kcal:Math.round((P*4+C*4+G*9)/10)*10};
}

async function flush(){
  if(!docRef || !dirty) return;
  if(writing){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,400); return; }
  writing=true; dirty=false;
  try{ await docRef.set(JSON.parse(JSON.stringify(state))); setSync('cloud'); }
  catch(e){
    dirty=true;
    if(e && e.code==='unavailable'){ setTimeout(flush, 2500+Math.random()*1500); }
    else setSync('local');
  }
  writing=false;
  if(dirty){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,400); }
}

  if(d.type==='hotel') return '<table class="clock">'+HOTEL.map(r=>'<tr><td>'+r[0]+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>').join('')+'</table><p class="hint">Dos vueltas en formato circuito, 60 s entre ejercicios.</p>';
  if(d.type==='match'){
    if(!d.ko) return '<p>Añade la hora del partido en la pestaña Liga y aquí aparecerán las horas exactas de cada comida.</p><p>Ese día desayunas sí o sí. Cafeína 45 min antes, 150-250 ml de bebida cada 15-20 min y 30-45 g de carbohidrato líquido en el descanso.</p>';
    const ko=d.ko; const early=ko<'14:00'; const rows=[];

    rows.push([addMin(ko,-75),'Snack','Plátano o barrita']);
    rows.push([addMin(ko,-45),'Cafeína','Unos 300 mg con bebida isotónica']);
    rows.push([ko,'Saque inicial','150-250 ml cada 15-20 min; en el descanso, 30-45 g de carbohidrato líquido']);
    return '<table class="clock">'+rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>').join('')+'</table>';
  }
  if(d.type==='recov') return '<p>En la primera hora: 110-130 g de carbohidrato y 40-50 g de proteína. Pésate antes y después: 1,5 L de líquido con sal por cada kilo perdido. Si hay tercer tiempo, primero el batido y la comida, y que las cervezas se queden en dos.</p>';
  if(d.type==='review') return '<table class="clock"><tr><td>1</td><td>Añade viajes, esquí o parones de la semana que viene en Viajes.</td><td></td></tr><tr><td>2</td><td>Mira el peso medio de la semana en Peso.</td><td></td></tr><tr><td>3</td><td>Decide la tarea concreta de cada bloque de estudio.</td><td></td></tr></table>';
  if(d.type==='study'){
    const k=t.key; const v=state.notes[k]||'';
    let pre='';
    if(d.area==='cera' && d.mon && CERA_WEEKS[d.mon]){
      const w=CERA_WEEKS[d.mon];
      pre='<table class="clock"><tr><td>Tema</td><td>'+esc(w.t)+'</td><td>'+esc(CERA_KIND[w.k]||'')+'</td></tr>'+
          '<tr><td>Hito</td><td colspan="2">'+esc(w.h)+'</td></tr>'+
          '<tr><td>Fase</td><td colspan="2">'+esc(CERA_PH[w.p].name)+', '+(w.m/60).toFixed(1).replace('.',',')+' h esta semana</td></tr></table>';
    }
    return pre+'<p class="hint">'+esc(AREA[d.area].hint)+'</p><textarea data-note="'+esc(k)+'" placeholder="Qué vas a hacer en este bloque">'+esc(v)+'</textarea>';
  }
  if(d.type==='weigh'){
    const w=state.weights[d.date];
    return '<div class="inline-form"><input type="number" inputmode="decimal" step="0.1" min="60" max="160" placeholder="kg" value="'+(w!=null?w:'')+'" id="w-'+d.date+'"><button class="btn small" data-action="saveweigh" data-date="'+d.date+'" data-key="'+esc(t.key)+'">Guardar peso</button></div>';
  }
  if(d.type==='text') return d.html;
  return '';
}

function ring(p,color){
  const r=17, c=2*Math.PI*r;
  return '<svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><circle cx="20" cy="20" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="3"/>'+
    (p>0?'<circle cx="20" cy="20" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+(c*p).toFixed(1)+' '+c.toFixed(1)+'"/>':'')+'</svg>';
}

    '<button class="diet-head" data-action="diettoggle" aria-expanded="'+ui.dietOpen+'">'+

      (D.rows.length?'<span class="kc">'+fmt(T.kcal)+' <small>kcal</small></span>':'')+ICONS.chev+
    '</button><div class="diet-body">';
  if(D.rows.length) h+='<div class="macros"><div><b>'+T.P+' g</b><span>Proteína</span></div><div><b>'+T.C+' g</b><span>Carbohidrato</span></div><div><b>'+T.G+' g</b><span>Grasa</span></div></div>';
  D.notes.forEach(n=>{ h+='<div class="dnote">'+esc(n)+'</div>'; });

    const k=date+'|meal'+i; const dn=!!state.done[k];
    h+='<div class="meal'+(dn?' done':'')+'"><button class="mchk" data-action="meal" data-key="'+esc(k)+'" aria-pressed="'+dn+'" aria-label="Marcar '+esc(r[1])+'"><span>'+ICONS.check+'</span></button>'+
      '<span class="mt">'+r[0]+'</span><div class="mb"><div class="mn">'+esc(r[1])+'</div><div class="mf">'+esc(r[2])+'</div>'+

  return h;

      h+='<div class="fr">'+(f.casa?'Universitario vs '+esc(f.rival):esc(f.rival)+' vs Universitario')+'</div>'+
        '<div class="fm">'+(f.casa?'En casa':'Fuera')+(f.dudosa?'. El calendario pone 3 de marzo, que es miércoles: he puesto el sábado 13. Corrígelo si no es así.':'')+'</div>'+
        '<div class="row2"><input type="date" aria-label="Fecha jornada '+f.j+'" data-fix="'+f.j+'" data-field="d" value="'+f.d+'"><input type="time" aria-label="Hora jornada '+f.j+'" data-fix="'+f.j+'" data-field="ko" value="'+esc(f.ko)+'"></div>';
    }
    h+='</div></div>';
  }
  h+='</section>';
  return h;
}

function viewPeso(){
  let h=pageHead('Peso','Lo que cuenta es la media semanal, no el dato de un día.');
  h+='<section class="section"><h3>Anotar peso</h3><div class="row2"><div class="field"><label for="pd">Día</label><input type="date" id="pd" value="'+TODAY+'"></div><div class="field"><label for="pk">Kilos</label><input type="number" id="pk" inputmode="decimal" step="0.1" min="60" max="160" placeholder="108,4"></div></div><button class="btn full" data-action="addweight">Guardar peso</button></section>';
  const entries=Object.keys(state.weights).sort().map(d=>[d,state.weights[d]]);
  if(!entries.length){ return h+'<section class="section"><p>Todavía no hay pesos. Pésate lunes, martes y miércoles de la primera semana: la media será tu punto de partida real.</p></section>'; }
  const byWeek={}; for(const [d,w] of entries){ const m=mondayOf(d); (byWeek[m]=byWeek[m]||[]).push(w); }
  const weeks=Object.keys(byWeek).sort().map(m=>({m, avg:byWeek[m].reduce((a,b)=>a+b,0)/byWeek[m].length, n:byWeek[m].length}));
  // gráfico
  const W=320,H=140,P=16; const ws=entries.map(e=>e[1]); const mn=Math.min(...ws)-0.8, mx=Math.max(...ws)+0.8;
  const t0=parse(entries[0][0]).getTime(), t1=Math.max(parse(entries[entries.length-1][0]).getTime(), t0+86400000*7);
  const X=d=>P+(parse(d).getTime()-t0)/(t1-t0)*(W-2*P); const Y=w=>P+(mx-w)/(mx-mn)*(H-2*P);
  const wline=weeks.map(w=>[X(addDays(w.m,3)),Y(w.avg)]);
  h+='<section class="section"><h3>Tendencia</h3><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución del peso">'+
    '<line x1="'+P+'" y1="'+(H-P)+'" x2="'+(W-P)+'" y2="'+(H-P)+'" stroke="var(--line)"/>'+
    entries.map(e=>'<circle cx="'+X(e[0]).toFixed(1)+'" cy="'+Y(e[1]).toFixed(1)+'" r="3" fill="var(--muted)" opacity=".55"/>').join('')+
    (wline.length>1?'<polyline fill="none" stroke="var(--c-gym)" stroke-width="2.5" stroke-linejoin="round" points="'+wline.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>':'')+
    wline.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="var(--c-gym)"/>').join('')+
    '<text x="'+P+'" y="12" font-size="11" fill="var(--muted)">'+fmtKg(mx-0.8)+' kg</text><text x="'+P+'" y="'+(H-3)+'" font-size="11" fill="var(--muted)">'+fmtKg(mn+0.8)+' kg</text>'+
    '</svg><p class="hint">Puntos grises: cada pesaje. Línea verde: media de cada semana.</p>';
  // consejo
  if(weeks.length>=2){
    const a=weeks[weeks.length-1], b=weeks[weeks.length-2]; const dlt=a.avg-b.avg; const pre=a.m<'2026-10-12';
    const lo=pre?0.7:0.4, hi=pre?1.0:0.8;
    let msg;
    if(-dlt>hi) msg='Has bajado '+fmtKg(-dlt)+' kg de media. Es más rápido de lo previsto: si se repite la semana que viene, suma 200-250 kcal al día.';
    else if(-dlt<0.3) msg='Has bajado '+fmtKg(Math.max(0,-dlt))+' kg de media. Si la semana que viene vuelve a quedarse por debajo de 0,3 kg, resta 150-200 kcal a los días bajos (miércoles y domingo).';
    else msg='Has bajado '+fmtKg(-dlt)+' kg de media. Dentro del ritmo del plan ('+String(lo).replace('.',',')+'-'+String(hi).replace('.',',')+' kg). No toques nada.';
    h+='<div class="note" style="margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14.5px">'+esc(msg)+'</div>';
  }
  h+='</section><section class="section"><h3>Medias semanales</h3><div class="wlist">';
  weeks.slice().reverse().forEach((w,i,arr)=>{
    const prev=arr[i+1]; const d=prev? w.avg-prev.avg : null;
    h+='<div><span>Semana del '+esc(shortDate(w.m))+' <span class="hint">('+w.n+(w.n===1?' pesaje':' pesajes')+')</span></span><span>'+fmtKg(w.avg)+' kg'+(d!=null?' <span class="'+(d<=0?'good':'bad')+'">'+(d<=0?'−':'+')+fmtKg(Math.abs(d))+'</span>':'')+'</span></div>';
  });
  h+='</div></section><section class="section"><h3>Pesajes</h3><div class="wlist">';
  entries.slice().reverse().slice(0,20).forEach(e=>{ h+='<div><span>'+esc(longDate(e[0]))+'</span><span>'+fmtKg(e[1])+' kg <button class="btn ghost small" data-action="delweight" data-date="'+e[0]+'" aria-label="Borrar pesaje">Borrar</button></span></div>'; });
  h+='</div></section>';
  return h;
}

function viewAjustes(){
  const s=state.settings; const tot=(Number(s.eng)+Number(s.cera)+Number(s.corr))/60;
  let h=pageHead('Ajustes','Horas de estudio por semana. La app las reparte en tus huecos libres, siempre antes de las 22:00.');
  h+='<section class="section"><h3>Estudio semanal</h3>';
  for(const a of ['eng','cera','corr']){
    h+='<div class="field"><label for="s-'+a+'">'+AREA[a].name+', horas por semana</label><input type="number" id="s-'+a+'" data-setting="'+a+'" step="0.5" min="0" max="15" inputmode="decimal" value="'+String(Number(s[a])/60)+'"></div>';
  }
  h+='<p>Total: '+tot.toFixed(1).replace('.',',')+' h a la semana.</p>';
  if(tot>15) h+='<div class="banner warn" style="margin:8px 0 0">Con 10 sesiones de entreno a la semana y en déficit, más de 15 h de estudio te va a quitar sueño. Y el sueño es lo que hace que pierdas grasa y no músculo.</div>';
  h+='<p class="hint">Huecos: lunes y jueves a las 18:15 (inglés), martes a las 18:15 (correduría), miércoles a las 20:30 (a las 19:00 cuando acabe la temporada), viernes a las 18:30, sábados sin partido a las 9:30 y domingo por la tarde (por la mañana cuando acabe la temporada) para el CERA, y sábados a las 11:30 y domingo a las 15:30 para la correduría.</p></section>';
  h+='<section class="section"><h3>Plan CERA</h3>'+
    '<label class="check"><input type="checkbox" data-setting="ceraAuto"'+(s.ceraAuto!==false?' checked':'')+'> Horas de CERA automáticas según la fase</label>'+
    '<p class="hint">Con esto activado, las horas de CERA las marca el plan: 5 h en el arranque, 8 h durante los módulos, 12-15 h en el sprint de mayo de 2028 y 0 h en las semanas de descanso. Desactívalo para usar el número de arriba.</p>'+
    '<div class="field"><label for="cd">Fecha del examen (opcional)</label><input type="date" id="cd" data-setting="ceraDate" value="'+esc(s.ceraDate||'')+'"></div>'+
    '<p class="hint">Si la dejas vacía, la cuenta atrás de la portada usa el próximo hito del plan.</p></section>';
  h+='<section class="section"><h3>Copia de seguridad</h3><p>Tus marcas, pesos y viajes se guardan en este móvil. Descarga una copia de vez en cuando, y siempre antes de cambiar de teléfono.</p>'+
    '<button class="btn full" data-action="export">Descargar copia</button>'+
    '<label class="btn ghost full" style="display:grid;place-items:center;margin-top:8px">Recuperar una copia<input type="file" accept=".json,application/json" id="importfile" style="display:none"></label></section>';
  h+='<section class="section"><h3>Empezar de cero</h3><p>Borra todas las tareas marcadas y las notas. Los viajes, pesos y ajustes se quedan.</p>'+
    '<button class="btn danger full" data-action="reset">'+(ui.confirmReset?'Pulsa otra vez para borrar las marcas':'Borrar marcas y notas')+'</button></section>';
  return h;
}

function render(){
  const v=document.getElementById('view');
  const map={semana:viewSemana, cera:viewCera, viajes:viewViajes, liga:viewLiga, peso:viewPeso, ajustes:viewAjustes};
  v.innerHTML=(map[ui.tab]||viewSemana)();
  const tabs=[['semana','Semana'],['cera','CERA'],['viajes','Viajes'],['liga','Liga'],['peso','Peso'],['ajustes','Ajustes']];
  document.getElementById('tabsin').innerHTML=tabs.map(t=>'<button class="tab'+(ui.tab===t[0]?' on':'')+'" data-action="tab" data-tab="'+t[0]+'" aria-current="'+(ui.tab===t[0]?'page':'false')+'">'+ICONS[t[0]]+'<span>'+t[1]+'</span></button>').join('');
}

/* ================= Eventos ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]'); if(!b) return;
  const a=b.dataset.action;
  if(a==='tab'){ ui.tab=b.dataset.tab; ui.confirmReset=false; ui.tripErr=''; saveUI(); render(); window.scrollTo(0,0); return; }
  if(a==='toggle'){ const k=b.dataset.key; if(state.done[k]) delete state.done[k]; else state.done[k]=1; commit(); return; }
  if(a==='expand'){ const k=b.dataset.key; ui.open[k]=!ui.open[k]; render(); return; }
  if(a==='sel'){ ui.sel=b.dataset.date; render(); return; }
  if(a==='mile'){ const k='mile|'+b.dataset.id; if(state.done[k]) delete state.done[k]; else state.done[k]=1; commit(); return; }
  if(a==='diettoggle'){ ui.dietOpen=!ui.dietOpen; saveUI(); render(); return; }
  if(a==='meal'){ const k=b.dataset.key; if(state.done[k]) delete state.done[k]; else state.done[k]=1; commit(); return; }
  if(a==='week'){ const dir=Number(b.dataset.dir); let n=addDays(mondayOf(ui.sel),7*dir); if(n<mondayOf(START)) n=mondayOf(START); if(n>LAST_WEEK) n=LAST_WEEK; ui.sel = (mondayOf(TODAY)===n && TODAY>=START)?TODAY:(n<START?START:n); render(); return; }
  if(a==='saveweigh'){
    const d=b.dataset.date; const el=document.getElementById('w-'+d); const v=parseFloat(String(el.value).replace(',','.'));
    if(!(v>=60 && v<=160)){ toast('Escribe un peso entre 60 y 160 kg'); return; }
    state.weights[d]=Math.round(v*10)/10; state.done[b.dataset.key]=1; commit(); toast('Peso guardado'); return;
  }
  if(a==='addweight'){
    const d=document.getElementById('pd').value; const v=parseFloat(String(document.getElementById('pk').value).replace(',','.'));
    if(!d){ toast('Elige el día'); return; }
    if(!(v>=60 && v<=160)){ toast('Escribe un peso entre 60 y 160 kg'); return; }
    state.weights[d]=Math.round(v*10)/10; commit(); toast('Peso guardado'); return;
  }
  if(a==='delweight'){ delete state.weights[b.dataset.date]; commit(); return; }
  if(a==='addtrip'){
    const type=document.getElementById('tt').value, from=document.getElementById('tf').value, to=document.getElementById('tto').value, note=document.getElementById('tn').value.trim();
    if(!from||!to){ ui.tripErr='Elige las dos fechas.'; render(); return; }
    if(to<from){ ui.tripErr='La fecha de vuelta es anterior a la de salida.'; render(); return; }
    ui.tripErr='';
    state.trips.push({id:'t'+Date.now().toString(36), type, from, to, note:note.slice(0,60)});
    commit(); toast('Periodo añadido. Agenda replanificada.'); return;
  }
  if(a==='deltrip'){ state.trips=state.trips.filter(t=>t.id!==b.dataset.id); commit(); toast('Periodo quitado'); return; }
  if(a==='export'){
    const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const link=document.createElement('a');
    link.href=url; link.download='temporada-copia-'+TODAY+'.json'; document.body.appendChild(link); link.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); link.remove(); },1000); toast('Copia descargada'); return;
  }
  if(a==='reset'){
    if(!ui.confirmReset){ ui.confirmReset=true; render(); return; }
    state.done={}; state.notes={}; ui.confirmReset=false; commit(); toast('Marcas y notas borradas'); return;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='importfile' && t.files && t.files[0]){
    const r=new FileReader();
    r.onload=()=>{ try{ const data=JSON.parse(r.result); if(!data||typeof data!=='object'||!('done' in data)) throw 0; state=normalize(data); commit(); toast('Copia recuperada'); }catch(err){ toast('Ese archivo no es una copia de la agenda'); } };
    r.readAsText(t.files[0]); return;
  }
  if(t.id==='tt'){ const p=document.getElementById('tdesc'); if(p) p.textContent=TRIP_TYPES[t.value].desc; return; }
  if(t.dataset.fix){
    const j='J'+t.dataset.fix; const cur=Object.assign({}, state.fixtures[j]||{});
    if(t.dataset.field==='d'){ if(!t.value){ render(); return; } cur.d=t.value; } else cur.ko=t.value;
    state.fixtures[j]=cur; commit(); toast('Jornada actualizada'); return;
  }
  if(t.dataset.setting){
    const k=t.dataset.setting;
    if(k==='ceraDate') state.settings.ceraDate=t.value;
    else if(k==='ceraAuto') state.settings.ceraAuto=t.checked;
    else { let h=parseFloat(String(t.value).replace(',','.')); if(!(h>=0)) h=0; if(h>15) h=15; state.settings[k]=Math.round(h*60); }
    commit(); return;
  }
});
let noteTimer=null;
document.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset || !t.dataset.note) return;
  const k=t.dataset.note; const v=t.value.slice(0,500);
  if(v) state.notes[k]=v; else delete state.notes[k];
  saveLocal();
  if(docRef){ dirty=true; clearTimeout(noteTimer); noteTimer=setTimeout(()=>{ clearTimeout(flushTimer); flush(); },1200); }
});

render();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  const now=ymd(new Date());
  if(now!==TODAY){ const wasToday=ui.sel===TODAY; TODAY=now; if(wasToday && now>=START) ui.sel=now; render(); }
});
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
