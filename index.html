<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan">
<meta name="theme-color" content="#15432E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --surface-2:#F5F7F4; --ink:#12201A; --muted:#5B6961; --line:#D3DAD2;
  --brand:#15432E; --brand-2:#1D5A3E; --on-brand:#F1F5F0; --on-brand-muted:#B4C8BA;
  --c-gym:#2F7A55; --c-rugby:#1E4F7A; --c-speed:#C9621F; --c-z2:#23879B; --c-mob:#7A8270;
  --c-match:#B8322A; --c-eng:#6E4FA6; --c-cera:#9A6810; --c-corr:#2A66C8; --c-check:#5E6A73; --c-trip:#2F8C86;
  --warn-bg:#FBF1DC; --warn-ink:#6B4A06;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#16201B; --surface-2:#1B2721; --ink:#E4EBE6; --muted:#98A69E; --line:#27352D;
    --brand:#123826; --brand-2:#1A4A33; --on-brand:#EAF1EC; --on-brand-muted:#97B2A1;
    --c-gym:#52A67D; --c-rugby:#5E92C4; --c-speed:#E8864A; --c-z2:#4EB1C5; --c-mob:#A0A893;
    --c-match:#E25A50; --c-eng:#A085D8; --c-cera:#D39E3E; --c-corr:#6497EC; --c-check:#8D99A2; --c-trip:#5FB6AF;
    --warn-bg:#3A2F16; --warn-ink:#F0D9A4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --surface-2:#1B2721; --ink:#E4EBE6; --muted:#98A69E; --line:#27352D;
  --brand:#123826; --brand-2:#1A4A33; --on-brand:#EAF1EC; --on-brand-muted:#97B2A1;
  --c-gym:#52A67D; --c-rugby:#5E92C4; --c-speed:#E8864A; --c-z2:#4EB1C5; --c-mob:#A0A893;
  --c-match:#E25A50; --c-eng:#A085D8; --c-cera:#D39E3E; --c-corr:#6497EC; --c-check:#8D99A2; --c-trip:#5FB6AF;
  --warn-bg:#3A2F16; --warn-ink:#F0D9A4;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--brand);}
html,body{min-height:100%;margin:0;}
body{min-height:100vh;min-height:100dvh;}
*,*::before,*::after{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--c-corr);outline-offset:2px;}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:84px;}

/* ---------- Board (header de la semana) ---------- */
.board{background:var(--brand);color:var(--on-brand);padding:18px 18px 16px;position:relative;overflow:hidden;}
.board::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(90deg,var(--on-brand) 0 22px,transparent 22px 34px);opacity:.35;}
.board-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--on-brand-muted);}
.phase{font-family:var(--display);font-weight:600;font-size:17px;color:var(--on-brand);letter-spacing:.2px;}
.sync{font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--on-brand-muted);display:inline-block;}
.sync.cloud i{background:#7FD3A5;}
.next{margin-top:14px;}
.next-l{font-size:14px;color:var(--on-brand-muted);}
.next-teams{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.02;margin:2px 0 6px;letter-spacing:-.2px;}
.next-teams .vs{font-weight:500;color:var(--on-brand-muted);font-size:26px;padding:0 4px;}
.next-meta{font-size:15px;}
.next-meta b{font-weight:600;}
.cera-line{margin-top:8px;font-size:14px;color:var(--on-brand-muted);}
.prog{margin-top:16px;}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden;}
.bar i{display:block;height:100%;background:var(--on-brand);border-radius:4px;transition:width .35s ease;}
.prog-l{display:flex;justify-content:space-between;margin-top:6px;font-size:14px;color:var(--on-brand-muted);}
.prog-l b{color:var(--on-brand);font-weight:600;}

/* ---------- Tira de la semana ---------- */
.weeknav{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 6px;}
.weeknav h2{margin:0;font-family:var(--display);font-weight:600;font-size:20px;}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;}
.iconbtn:disabled{opacity:.35;cursor:default;}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:4px 10px 10px;}
.day{border:0;background:transparent;border-radius:12px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.day .dl{font-size:13px;color:var(--muted);}
.day .ring{position:relative;width:40px;height:40px;}
.day .ring svg{position:absolute;inset:0;transform:rotate(-90deg);}
.day .ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:18px;}
.day.sel{background:var(--surface);box-shadow:0 0 0 1px var(--line);}
.day.today .dl{color:var(--ink);font-weight:600;}
.day .mk{height:5px;display:flex;gap:3px;}
.day .mk b{width:5px;height:5px;border-radius:50%;}

/* ---------- Día y tareas ---------- */
.dayhead{padding:6px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.dayhead h3{margin:0;font-family:var(--display);font-size:24px;font-weight:700;}
.dayhead .cnt{font-size:14px;color:var(--muted);white-space:nowrap;}
.banner{margin:0 12px 10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border-left:4px solid var(--c-trip);font-size:14.5px;}
.banner b{font-weight:600;}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink);border-left-color:var(--c-cera);}
.list{padding:0 12px;display:flex;flex-direction:column;gap:8px;}
.task{background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);overflow:hidden;}
.trow{display:flex;align-items:stretch;min-height:64px;}
.trow::before{content:"";width:5px;background:var(--c);flex:none;}
.chk{flex:none;width:58px;border:0;background:transparent;display:grid;place-items:center;}
.chk span{width:28px;height:28px;border-radius:8px;border:2px solid var(--c);display:grid;place-items:center;transition:background .15s ease;}
.chk svg{opacity:0;transition:opacity .15s ease;}
.task.done .chk span{background:var(--c);}
.task.done .chk svg{opacity:1;}
.tbody{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:10px 4px 10px 0;display:flex;flex-direction:column;justify-content:center;}
.tline{display:flex;align-items:baseline;gap:8px;}
.ttime{font-family:var(--display);font-weight:600;font-size:17px;color:var(--c);min-width:42px;}
.ttitle{font-weight:600;font-size:16.5px;}
.task.done .ttitle{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted);}
.tsub{font-size:14px;color:var(--muted);margin-top:1px;}
.tsub em{font-style:normal;color:var(--c);font-weight:500;}
.more{flex:none;width:42px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);}
.more svg{transition:transform .2s ease;}
.task.open .more svg{transform:rotate(180deg);}
.tdetail{display:none;padding:2px 14px 14px 63px;font-size:14.5px;}
.task.open .tdetail{display:block;}
.tdetail p{margin:6px 0;}
.tdetail .note{padding:8px 10px;border-radius:10px;background:var(--surface-2);margin:8px 0;}
.clock{width:100%;border-collapse:collapse;margin:6px 0;}
.clock td{padding:5px 6px 5px 0;vertical-align:top;border-bottom:1px solid var(--line);}
.clock tr:last-child td{border-bottom:0;}
.clock td:first-child{font-family:var(--display);font-weight:600;color:var(--c);width:48px;white-space:nowrap;}
.clock td:last-child{color:var(--muted);font-size:13.5px;}
.task.info .trow{min-height:52px;}
.task.info .chk{visibility:hidden;}
.inline-form{display:flex;gap:8px;margin-top:8px;}
.inline-form input{flex:1;min-width:0;}
textarea{width:100%;min-height:64px;resize:vertical;}

/* ---------- Dieta ---------- */
.diet{margin:14px 12px 0;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);overflow:hidden;}
.diet-head{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:14px 14px 12px;text-align:left;}
.diet-head .dh{flex:1;min-width:0;}
.diet-head h4{margin:0;font-family:var(--display);font-size:20px;font-weight:600;}
.diet-head .ds{font-size:14px;color:var(--muted);}
.diet-head .kc{font-family:var(--display);font-weight:700;font-size:24px;white-space:nowrap;}
.diet-head .kc small{font-size:14px;font-weight:500;color:var(--muted);}
.diet-head svg{color:var(--muted);transition:transform .2s ease;flex:none;}
.diet.open .diet-head svg{transform:rotate(180deg);}
.diet-body{display:none;padding:0 14px 14px;}
.diet.open .diet-body{display:block;}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px;}
.macros div{background:var(--surface-2);border-radius:10px;padding:8px 10px;}
.macros b{display:block;font-family:var(--display);font-size:20px;font-weight:700;}
.macros span{font-size:13px;color:var(--muted);}
.dnote{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--surface-2);margin:0 0 8px;}
.meal{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);}
.meal .mchk{flex:none;width:36px;height:36px;margin-top:-4px;border:0;background:transparent;display:grid;place-items:center;}
.meal .mchk span{width:22px;height:22px;border-radius:6px;border:2px solid var(--c-gym);display:grid;place-items:center;}
.meal .mchk svg{opacity:0;width:13px;height:13px;}
.meal.done .mchk span{background:var(--c-gym);}
.meal.done .mchk svg{opacity:1;}
.meal .mt{font-family:var(--display);font-weight:600;font-size:16px;color:var(--c-gym);min-width:42px;}
.meal .mb{flex:1;min-width:0;}
.meal .mn{font-weight:600;font-size:15px;}
.meal.done .mn{color:var(--muted);text-decoration:line-through;}
.meal .mf{font-size:14.5px;}
.meal .mm{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;}

/* ---------- Resumen semanal ---------- */
.summary{margin:16px 12px 0;padding:14px;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);}
.summary h4{margin:0 0 10px;font-family:var(--display);font-size:18px;font-weight:600;}
.srow{display:grid;grid-template-columns:92px 1fr 52px;gap:10px;align-items:center;margin:8px 0;font-size:14.5px;}
.srow .sbar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);}
.srow .sbar i{display:block;height:100%;background:var(--c);}
.srow .sn{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;}

/* ---------- Vistas secundarias ---------- */
.pagehead{background:var(--brand);color:var(--on-brand);padding:18px 18px 16px;position:relative;}
.pagehead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(90deg,var(--on-brand) 0 22px,transparent 22px 34px);opacity:.35;}
.pagehead h1{margin:0;font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05;}
.pagehead p{margin:6px 0 0;color:var(--on-brand-muted);font-size:14.5px;max-width:60ch;}
.section{margin:14px 12px;padding:14px;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);}
.section h3{margin:0 0 10px;font-family:var(--display);font-weight:600;font-size:20px;}
.section p{margin:6px 0;font-size:14.5px;color:var(--muted);}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0;}
.field label{font-size:14px;color:var(--muted);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 11px;min-height:44px;width:100%;}
.btn{border:0;border-radius:12px;min-height:46px;padding:0 18px;background:var(--brand-2);color:var(--on-brand);font-weight:600;}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);}
.btn.danger{background:transparent;color:var(--c-match);box-shadow:inset 0 0 0 1px var(--c-match);}
.btn.small{min-height:38px;padding:0 12px;font-size:14px;}
.btn.full{width:100%;margin-top:6px;}
.err{color:var(--c-match);font-size:14px;margin-top:6px;}
.tripitem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);}
.tripitem:first-of-type{border-top:0;}
.tripitem .tb{flex:1;min-width:0;}
.tripitem .tt{font-weight:600;}
.tripitem .td{font-size:14px;color:var(--muted);}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c-trip);margin-top:6px;flex:none;}
.fix{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line);}
.fix:first-of-type{border-top:0;}
.fix .jn{font-family:var(--display);font-weight:700;font-size:22px;color:var(--muted);}
.fix.next .jn{color:var(--c-match);}
.fix .fr{font-weight:600;}
.fix .fm{font-size:14px;color:var(--muted);margin-bottom:6px;}
.fix.bye .fr{color:var(--muted);font-weight:500;}
.fix.past{opacity:.6;}
.chart{width:100%;height:auto;display:block;margin:6px 0 4px;}
.wlist{font-variant-numeric:tabular-nums;}
.wlist div{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px;}
.wlist div:first-child{border-top:0;}
.good{color:var(--c-gym);} .bad{color:var(--c-match);}
.hint{font-size:14px;color:var(--muted);}
.empty{padding:24px 18px;text-align:center;color:var(--muted);}

/* ---------- Inglés: ejercicios ---------- */
.cq{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line);}
.cq:first-of-type{border-top:0;}
.cq .cn{font-family:var(--display);font-weight:600;font-size:15px;color:var(--c-eng);}
.cq .cs{margin:2px 0 7px;font-size:14.5px;}
.cq .co{display:flex;flex-wrap:wrap;gap:5px;}
.cq .co label{position:relative;}
.cq .co input{position:absolute;opacity:0;width:0;height:0;}
.cq .co span{display:inline-block;padding:4px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);font-size:14px;}
.cq .co input:checked + span{background:var(--c-eng);border-color:var(--c-eng);color:#fff;}
.cq .co input:focus-visible + span{outline:2px solid var(--c-corr);outline-offset:2px;}
.cq input.cg{min-height:38px;padding:6px 10px;width:150px;max-width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;}
.cfb{margin-top:7px;font-size:14px;padding:8px 10px;border-radius:9px;display:none;line-height:1.45;}
.cfb.on{display:block;}
.cfb.y{background:rgba(47,122,85,.12);color:var(--c-gym);}
.cfb.n{background:rgba(184,50,42,.12);color:var(--c-match);}
.cq.y .cn{color:var(--c-gym);} .cq.n .cn{color:var(--c-match);}
.cscore{font-family:var(--display);font-weight:700;font-size:18px;margin-left:10px;}
.cweek{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
.cweek:first-of-type{border-top:0;}
.cweek .cwn{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);}
.cweek.cur .cwn{color:var(--c-eng);}
.cweek.past{opacity:.55;}
.cweek .cwt{font-weight:600;font-size:15px;}
.cweek .cwg{font-size:14px;color:var(--muted);}

/* ---------- Pestañas ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10;}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);}
.tab{border:0;background:transparent;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;color:var(--muted);}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@media (max-width:380px){.tab{font-size:11.5px;}}
.tab.on{color:var(--ink);font-weight:600;}
.tab.on svg{color:var(--brand-2);}
:root[data-theme="dark"] .tab.on svg{color:var(--c-gym);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab.on svg{color:var(--c-gym);}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.toast.show{opacity:1;}
@media (prefers-reduced-motion: reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
</div>
<nav id="tabs" aria-label="Secciones"><div class="in" id="tabsin"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/*LOGIC_START*/
const START = '2026-11-09';
const SKI_FROM = '2027-01-01';
const SKI_TO   = '2027-01-07';
const LAST_WEEK = '2027-08-30';
const DOW_L = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DOW_S = ['L','M','X','J','V','S','D'];
const MON = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MON_S = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const pad = n => String(n).padStart(2,'0');
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parse(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function dow(s){ return (parse(s).getDay()+6)%7; }
function mondayOf(s){ return addDays(s,-dow(s)); }
function diffDays(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
function longDate(s){ const d=parse(s); return DOW_L[dow(s)]+' '+d.getDate()+' de '+MON[d.getMonth()]; }
function shortDate(s){ const d=parse(s); return d.getDate()+' '+MON_S[d.getMonth()]; }
function addMin(t,m){ const [h,mm]=t.split(':').map(Number); let x=h*60+mm+m; x=((x%1440)+1440)%1440; return pad(Math.floor(x/60))+':'+pad(x%60); }

/* ================= Fases ================= */
function phaseOf(date){
  const mon=mondayOf(date);
  if(date<START) return 'antes';
  if(date>=SKI_FROM && date<=SKI_TO) return 'esqui';
  if(mon>='2026-11-09' && mon<='2026-11-30') return 'bloque1';
  if(mon==='2026-12-07' || mon==='2026-12-14') return 'bloque2';
  if(mon==='2026-12-21') return 'navidad';
  if(mon==='2026-12-28') return date<SKI_FROM ? 'afinado' : 'esqui';
  if(date>SKI_TO) return postPhase(weekNum(date));
  return 'bloque1';
}
/* Macrociclo de 2027: de la vuelta de Cervinia (semana 9) al examen de inglés (semana 43). */
function postPhase(w){
  if(w<=9)  return 'vuelta';
  if(w<=11) return 'reinicio';
  if(w<=19) return 'bloque3';
  if(w===20) return 'semanasanta';
  if(w<=28) return 'bloque4';
  if(w<=38) return 'bloque5';
  return 'agosto';
}

function weekNum(date){ const d=diffDays('2026-11-09', mondayOf(date)); return Math.floor(d/7)+1; }

const BLOCK_START = {bloque3:12, bloque4:21, bloque5:29};
const DELOAD = [15,19,24,28,32,36];
function isDeload(date){ return phaseOf(date)==='semanasanta' || DELOAD.includes(weekNum(date)); }

function tripOn(date,state){
  let best=null;
  for(const t of (state.trips||[])){
    if(t.from<=date && date<=t.to){ if(!best || TRIP_PRI[t.type]>TRIP_PRI[best.type]) best=t; }
  }
  return best;
}

    {g:1,a:['should'],t:'______ you need any help, let me know.',e:'Inversión condicional formal: Should you need… = If you should need… Ideal para correos y proposals.'},

    {o:['to rewrite','rewrite','rewriting','rewrote'],a:1,t:'They made us ______ the whole report again.',e:'make y let + objeto + infinitivo SIN to. En pasiva sí reaparece: we were made to rewrite.'},

    {o:['to answer','answering','answer','answered'],a:1,t:'He avoided ______ the question.',e:'avoid + -ing. De la misma lista cerrada que la primera pregunta: conviene repasarlas juntas.'}],
 4:[{o:['expect','are expecting','are expected','have expected'],a:2,t:'Premiums ______ to rise by 4% next year.',e:'Pasiva de reporte: las primas no esperan, son esperadas. Estructura clave en informes.'},

function allocate(target, slots){
  const out=slots.map(()=>0); let rem=target; let open=slots.map((_,i)=>i); let guard=0;
  while(rem>0.5 && open.length && guard++<20){
    const W=open.reduce((a,i)=>a+slots[i].w,0);
    const next=[]; let used=0; let capped=false;
    for(const i of open){
      const share=rem*slots[i].w/W;
      if(out[i]+share>=slots[i].cap){ used+=slots[i].cap-out[i]; out[i]=slots[i].cap; capped=true; }
      else next.push(i);
    }
    if(!capped){ for(const i of open) out[i]+=rem*slots[i].w/W; rem=0; break; }
    rem-=used; open=next;
  }
  let left=Math.max(0,rem);
  const mins=out.map(m=>{ const r=Math.round(m/5)*5; if(r<15){ left+=m; return 0; } return r; });
  return {mins, left:Math.round(left/5)*5};
}

function runFor(date){

}

/* Paseo diario. Es el único que empieza hoy mismo: andar no es volumen de entreno. */
function paseoFor(date, tareas){
  const yaHayCardio=(tareas||[]).some(t=>t.cat==='z2'||t.cat==='speed');
  if(date<=DIETA_TO)
    return {dur:'30 min', t:'21:45', sub:'Ritmo cómodo, 4,5-5 km/h. Mientras haya dieta en marcha no pasa de aquí.'};
  if(yaHayCardio)
    return {dur:'20 min', t:'21:45', sub:'Corto: hoy ya has entrenado. Es para no pasar la noche sentado.'};
  const w=weekNum(date);
  if(w<=14) return {dur:'40 min', t:'21:45', sub:'A buen paso, 5,5-6 km/h. Si pillas cuestas, mejor.'};
  return {dur:'45 min', t:'21:45', sub:'A buen paso, 5,5-6,5 km/h. Si pillas cuestas, mejor.'};
}

/* Carrera corta del lunes por la tarde */
function runCortaFor(date){
  const w=weekNum(date);
  if(isDeload(date)) return {main:'Suave, sin mirar el ritmo. Semana de descarga', total:'20 min'};
  if(w<=11) return {main:'Caminar-correr: 4 min de trote / 1 min 30 s caminando × 4', total:'22 min'};
  if(w<=14) return {main:'Caminar-correr: 6 min / 1 min 30 s × 3', total:'23 min'};
  if(w<=20) return {main:'Continuo suave en cinta, al 1 % de inclinación', total:'25 min'};
  if(w<=28) return {main:'Continuo suave en cinta, al 1 % de inclinación', total:'30 min'};
  return {main:'Continuo, o 5 × 3 min algo más fuerte con 2 min suaves', total:'35 min'};
}
/* Bici estática del martes por la tarde */
function spinFor(date){
  const w=weekNum(date);
  if(isDeload(date)) return {dur:'30 min', main:'Zona 2 suave. Semana de descarga: mover las piernas y poco más.'};
  if(w<=11) return {dur:'40 min', main:'Zona 2, cadencia 85-95. Resistencia que te deje hablar.'};
  if(w<=20) return {dur:'45 min', main:'Zona 2 continua, cadencia 85-95.'};
  if(w<=28) return {dur:'50 min', main:'Zona 2 con 3 × 6 min algo más duros, 3 min suaves entre bloques.'};
  return {dur:'55 min', main:'Zona 2 con 4 × 8 min en tempo.'};
}
/* Monte del sábado por la mañana. La bici estática queda como plan B de lluvia. */
function monteFor(date){
  const w=weekNum(date);
  const ph=phaseOf(date);
  if(ph==='agosto') return {dur:'60-75 min', main:'Suave. En agosto manda el examen.'};
  if(isDeload(date)) return {dur:'45-60 min', main:'Corto y sin buscar desnivel. Semana de descarga.'};
  if(w<=11) return {dur:'60-75 min', main:'Busca desnivel. Bajar cuesta abajo es trabajo excéntrico de cuádriceps, lo más parecido a esquiar que hay sin nieve.'};
  if(w<=20) return {dur:'75-90 min', main:'Con desnivel. Esta es tu sesión larga de la semana.'};
  if(w<=28) return {dur:'90 min', main:'Con desnivel, y mejor si es continuo que con paradas.'};
  return {dur:'90-120 min', main:'La salida larga. Lleva agua y algo de comer a partir de hora y media.'};
}
/* Bici estática larga del sábado */
function satBikeFor(date){
  const w=weekNum(date);
  const ph=phaseOf(date);
  if(ph==='agosto') return {dur:'60 min', main:'Zona 2 suave. En agosto se mantiene, que la carga de estas semanas se la lleva el examen.'};

  if(w<=11) return {dur:'60 min', main:'Zona 2 continua. Si hace bueno, cámbialo por monte con desnivel.'};
  if(w<=15) return {dur:'65 min', main:'Zona 2 continua, cadencia alta.'};
  if(w<=20) return {dur:'75 min', main:'Zona 2 con 3 × 8 min en tempo.'};
  if(w<=24) return {dur:'80 min', main:'Zona 2. Lleva bidón y toalla: en interior se suda el doble que fuera.'};
  if(w<=32) return {dur:'90 min', main:'Zona 2 con 4 × 10 min en tempo.'};
  return {dur:'90 min', main:'Zona 2 larga. A estas alturas la calle ya te va a saber a poco.'};
}

/* Vuelta de un viaje largo o de una enfermedad: ajusta el gimnasio */
function returnMod(date,state){
  for(const t of (state.trips||[])){
    if(!['esqui','vacaciones','enfermo'].includes(t.type)) continue;
    if(diffDays(t.from,t.to)<2) continue;
    if(!(t.to<date)) continue;
    const gap=diffDays(t.to,date);
    if(gap>10) continue;
    let gymDays=0;
    for(let d=addDays(t.to,1); d<date; d=addDays(d,1)){
      if(dow(d)<=3){ const tr=tripOn(d,state); if(!(tr && TRIP_TYPES[tr.type].blocks)) gymDays++; }
    }
    if(gymDays<2) return t.type;
  }
  return null;
}

/* ================= La semana ================= */
function buildWeek(mon,state){
  const dates=[0,1,2,3,4,5,6].map(i=>addDays(mon,i));
  const days={}; dates.forEach(d=>days[d]=[]);
  const trip={}; dates.forEach(d=>trip[d]=tripOn(d,state));
  const active=d=>d>=START;
  const blocked=d=>!!(trip[d] && TRIP_TYPES[trip[d].type].blocks);
  const push=(d,t)=>{ t.key=d+'|'+t.id; if(t.count===undefined) t.count=true; days[d].push(t); };
  const phase=phaseOf(dates[0]);

  const isSki = d => phaseOf(d)==='esqui';

  /* --- Gimnasio --- */
  const DEF=gymSet(phaseOf(dates[2]));
  const gymPlan={}; const lost=[];
  const LIGHT=['navidad','afinado','semanasanta','agosto'];   // semanas de solo dos sesiones
  const twoDays=[0,2];       // lunes y miércoles
  for(let i=0;i<4;i++){
    const d=dates[i]; if(!active(d) || isSki(d)) continue;
    const ph=phaseOf(d);
    if(LIGHT.includes(ph) && !twoDays.includes(i)) continue;
    if(blocked(d)){ if(DEF[i][0]!=='D') lost.push(DEF[i]); }
    else gymPlan[d]={k:DEF[i]};
  }
  const PRIO=['C','A','B'];
  lost.sort((a,b)=>PRIO.indexOf(a[0])-PRIO.indexOf(b[0]));
  const thu=dates[3], fri=dates[4];
  if(gymPlan[thu] && lost.length && !LIGHT.includes(phase)){
    const pick=lost.shift();
    gymPlan[thu]={k:pick, rec:'Recuperada del '+GYM[pick].day+'. Sustituye al gimnasio D.'};
  }
  if(lost.length && active(fri) && !blocked(fri) && !LIGHT.includes(phase)){
    const k=lost.shift(); gymPlan[fri]={k, rec:'Recuperada del '+GYM[k].day+'.'};
  }
  const lostNote = lost.length ? 'Esta semana no se recupera: '+lost.map(k=>GYM[k].name).join(' y ')+'. No se amontonan sesiones.' : '';

  for(const d of dates){
    if(!gymPlan[d]) continue;
    const kk=gymPlan[d].k; const g=GYM[kk]; const ph=phaseOf(d);
    const mods=[]; if(GYM_MOD[ph]) mods.push(GYM_MOD[ph]);
    const rm=returnMod(d,state);
    if(rm==='enfermo') mods.unshift('Vuelta tras estar enfermo: todo al 60-70 %.');
    else if(rm) mods.unshift('Vuelta de viaje: una serie menos por ejercicio.');
    const ld=loadFor(d);
    if(ld) mods.unshift('Básico de la semana: '+ld.main+'. '+ld.note);
    if(gymPlan[d].rec) mods.unshift(gymPlan[d].rec);
    let emph = rm ? (rm==='enfermo'?'Al 60-70 %':'Una serie menos') : (ph==='navidad'?'Mitad de series':(ph==='afinado'?'Afinado':((ld&&ld.deload)?'Descarga':(ld?ld.main:''))));
    const iso = kk==='C' ? isoFor(d) : null;
    if(kk==='C' && ph==='bloque2') mods.push('Antes del peso muerto: saltos laterales 3 × 6 por lado, aterrizando y estabilizando 1 s. Si no aterrizas estable, acorta el salto.');
    push(d,{id:'gym', cat:'gym', t:'14:20', title:g.name, sub:g.what+'. Hasta las '+g.end+'.', emph,
      detail:{type:'gym', k:kk, mods, iso}});
  }

  /* --- Cardio de tarde: lunes cinta, martes bici estática --- */
  for(const i of [0,1]){
    const d=dates[i]; if(!active(d)) continue;
    const ph=phaseOf(d);
    if(ph==='navidad' || ph==='afinado' || ph==='esqui') continue;
    const tr=trip[d];
    if(tr) continue;
    /* Mientras dure la dieta del médico no se sube volumen: solo mover las piernas */
    if(d<=DIETA_TO) continue;   /* hasta que acabe la dieta, la tarde es solo el paseo diario */
    if(ph==='agosto'){
      if(i===1) push(d,{id:'spin', cat:'z2', t:'19:30', title:'Bici estática, 45 min', sub:'Opcional. En agosto manda el examen.', count:false, detail:{type:'spin', b:{dur:'45 min', main:'Zona 2 suave.'}}});
      continue;
    }
    if(i===0){
      const r=runCortaFor(d);
      push(d,{id:'runcorta', cat:'speed', t:'19:30', title:'Cinta, '+r.total, sub:r.main+'.', detail:{type:'run', r, cinta:true}});
    } else {
      const b=spinFor(d);
      push(d,{id:'spin', cat:'z2', t:'19:30', title:'Bici estática, '+b.dur, sub:b.main, detail:{type:'spin', b}});
    }
  }

  /* --- Días de la fase de afinado sin gimnasio --- */
  for(const i of [1,3]){
    const d=dates[i]; if(!active(d) || isSki(d) || blocked(d)) continue;
    if(phaseOf(d)!=='afinado') continue;
    if(i===1) push(d,{id:'z2', cat:'z2', t:'18:00', title:'Zona 2, 30 min + movilidad', sub:'Muy suave. Mover sin cansar.', detail:{type:'z2', extra:''}});
    else push(d,{id:'rest', cat:'check', t:'', title:'Descanso', sub:'Mañana empieza el esquí.', count:false, detail:{type:'text', html:'<p>Prepara la maleta y duerme. No existe la última sesión que te pone más en forma.</p>'}});
  }

  /* --- Viernes --- */
  if(active(fri) && !blocked(fri) && !gymPlan[fri] && !isSki(fri)){
    const ph=phaseOf(fri);
    if(ph==='afinado') push(fri,{id:'rest', cat:'check', t:'', title:'Descanso', sub:'Mañana empieza el esquí. Hoy no se entrena.', count:false, detail:{type:'text', html:'<p>Prepara la maleta y duerme.</p>'}});
    else if(ph==='navidad') push(fri,{id:'z2opt', cat:'z2', t:'12:00', title:'Paseo largo, 45 min', sub:'Opcional. Hoy manda la familia.', count:false, detail:{type:'monte'}});
    else { const sw=swimFor(fri); push(fri,{id:'swim', cat:'z2', t:'18:00', title:'Natación, 45 min', sub:sw.total+'. Tu sesión fija de base aeróbica.', detail:{type:'swim', sw}}); }
  }

  /* --- Sábado y domingo --- */
  const sat=dates[5], sun=dates[6];
  if(active(sat) && !blocked(sat) && !isSki(sat)){
    const ph=phaseOf(sat);
    const bk=(ph==='afinado'||ph==='navidad')?null:satBikeFor(sat);
    const exd=(state.settings&&state.settings.caeDate)||CAE_EXAM;
    if(exd===sat){
      push(sat,{id:'exam', cat:'eng', t:'', title:'Examen C1 Advanced', sub:'Hoy no se entrena nada.', count:false,
        detail:{type:'text', html:'<p>Desayuna como un día normal de entreno, nada raro. Llega con tiempo y con el DNI.</p><p>Son cuatro horas y media: lleva agua y una pieza de fruta para el descanso.</p><p class="hint">Mañana vuelve la rutina. Hoy no.</p>'}});
    }
    else if(bk){
      const mt=monteFor(sat);
      push(sat,{id:'monte', cat:'z2', t:'10:00', title:'Monte, '+mt.dur,
        sub:mt.main+' Si llueve o no hay plan, bici estática '+bk.dur+' en el gimnasio.',
        detail:{type:'monte', mt, bk}});
    }
    if(ph!=='navidad') push(sat,{id:'evento', cat:'trip', t:'', title:'¿Hay evento hoy?', sub:'Si lo hay, pon el número de copas antes de salir.', count:false, detail:{type:'evento'}});
  }
  if(active(sun) && !blocked(sun) && !isSki(sun)){
    const ph=phaseOf(sun);
    if(ph==='navidad' || ph==='afinado') push(sun,{id:'z2opt', cat:'z2', t:'11:00', title:'Paseo largo, 45 min', sub:'Opcional. Recuperación activa, sin intensidad.', count:false, detail:{type:'monte'}});
    else { const r=runFor(sun); push(sun,{id:'run', cat:'speed', t:'11:00', title:r.label+r.total, sub:(r.opt?'Opcional estas dos primeras semanas. ':'')+r.main+'.', count:!r.opt, detail:{type:'run', r}}); }
  }

  /* --- Días de esquí --- */
  for(const d of dates){
    if(!active(d) || !isSki(d)) continue;
    push(d,{id:'skiwarm', cat:'speed', t:'08:30', title:'Calentamiento antes de la primera bajada', sub:'6 min. Donde se evitan la mitad de los sustos.', detail:{type:'skiwarm'}});
    push(d,{id:'ski', cat:'match', t:'09:30', title:'Esquiar', sub:'Para cuando las piernas dejen de responder, no una bajada después.', detail:{type:'skiday'}});
    push(d,{id:'skirec', cat:'z2', t:'17:00', title:'Recuperación', sub:'30-40 g de proteína en la primera hora y 10 min de movilidad.', detail:{type:'skirec'}});
  }

  /* --- Viajes --- */
  for(const d of dates){
    if(!active(d) || isSki(d)) continue; const tr=trip[d]; if(!tr) continue;
    if(tr.type==='esqui') push(d,{id:'ski', cat:'trip', t:'', title:'Esquí', sub:'Cuenta como piernas y Zona 2.', detail:{type:'skiday'}});
    else if(tr.type==='vacaciones') push(d,{id:'activ', cat:'trip', t:'', title:'Caminar o monte, 45-60 min', sub:'Actividad suave diaria.', detail:{type:'text', html:'<p>Sin intensidad. Es para mantener el hábito y la Zona 2.</p>'}});
    else if(tr.type==='trabajo' && dow(d)<=3) push(d,{id:'hotel', cat:'gym', t:'', title:'Circuito de hotel, 30 min', sub:'Sustituye al gimnasio durante el viaje.', detail:{type:'hotel'}});
    else if(tr.type==='enfermo') push(d,{id:'info-sick', cat:'check', t:'', title:'Sin entrenamiento', sub:'Descansa. Si has tenido fiebre, espera a estar sin ella antes de volver.', count:false, detail:{type:'text', html:'<p>Al volver, el gimnasio marcará las dos primeras sesiones al 60-70 %.</p>'}});
  }

  /* --- Paseo diario --- */
  for(const d of dates){
    if(!active(d) || isSki(d)) continue;
    const tr=trip[d]; if(tr && tr.type==='enfermo') continue;
    const ph=phaseOf(d);
    const p=paseoFor(d, days[d]);
    push(d,{id:'paseo', cat:'mob', t:p.t, title:'Paseo, '+p.dur, sub:p.sub, count: ph!=='navidad', detail:{type:'paseo', p}});
  }

  /* --- Movilidad, pesaje y revisión --- */
  const MOB_T=['22:15','22:15','22:00','22:15','21:30','21:30','12:00'];
  for(const d of dates){
    if(!active(d)) continue; const tr=trip[d]; const i=dow(d);
    const sick=tr&&tr.type==='enfermo'; const ph=phaseOf(d);
    push(d,{id:'mob', cat:'mob', t: isSki(d)?'21:30':MOB_T[i], title: sick?'Movilidad suave, 10 min':(i===6&&!isSki(d)?'Movilidad, 20 min':'Movilidad, 10 min'), sub: isSki(d)?'Sofá, cuádriceps y tobillo. Es la que más te va a servir.':'Tobillo, sofá y 90/90 son las tres que cuentan.', detail:{type:'mob'}});
    if([1,3,4].includes(i) && (!tr || tr.type==='paron') && ph!=='navidad' && ph!=='esqui') push(d,{id:'weigh', cat:'check', t:'07:00', title:'Pesaje en ayunas', sub:'Después de orinar y antes de beber.', detail:{type:'weigh', date:d}});
    if(i===6 && ph!=='esqui' && (!tr || tr.type==='paron' || tr.type==='trabajo')) push(d,{id:'review', cat:'check', t:'21:00', title:'Revisión semanal, 15 min', sub:'Peso medio, eventos de la semana que viene y tareas de estudio.', detail:{type:'review'}});
  }

  /* --- Estudio --- */
  const left={}; const set=state.settings||{};
  for(const area of ['eng','cera','corr']){
    const target=Math.max(0,Number(set[area])||0);
    const sl=SLOTS.filter(s=>s.area===area).map(s=>Object.assign({},s,{date:dates[s.dow]})).filter(s=>{
      if(!active(s.date)) return false;
      const tr=trip[s.date];
      if(tr && !TRIP_TYPES[tr.type].study.includes(area)) return false;
      const ph=phaseOf(s.date);
      if(ph==='navidad' || ph==='esqui') return false;
      return true;
    });
    if(!target) continue;
    if(!sl.length){ if(phase!=='navidad' && phase!=='esqui' && phase!=='afinado') left[area]=target; continue; }
    const r=allocate(target,sl);
    if(r.left>0) left[area]=r.left;
    const ROLE={gram:'Gramática y ejercicios', vocab:'Vocabulario y escucha', prod:'Writing y speaking'};
    sl.forEach((s,i)=>{
      const m=r.mins[i]; if(!m) return;
      const cw = area==='eng' ? caeWeek(s.date) : null;
      const role = area==='eng' ? ({0:'gram',3:'vocab',6:'prod'}[s.dow] || 'gram') : null;
      push(s.date,{id:area, cat:area, t:s.t,
        title: cw ? ('Inglés · '+ROLE[role]) : AREA[area].name,
        sub: cw ? (m+' min · semana '+cw.n+', '+cw.t.toLowerCase()) : (m+' min, hasta las '+addMin(s.t,m)+'.'),
        detail:{type:'study', area, role, cwn: cw?cw.n:null}});
    });
  }

  const SORTK={ski:'09:00', activ:'10:00', hotel:'07:30', evento:'20:00', rest:'09:00'};
  const sk=t=> t.t || SORTK[t.id] || (t.count?'23:59':'00:00');
  for(const d of dates) days[d].sort((a,b)=>{ const x=sk(a), y=sk(b); return x<y?-1:x>y?1:0; });
  return {dates, days, trip, left, lostNote, phase};
}

/* ===== Dieta del médico: un mes por fases, del 9 de noviembre al 10 de diciembre ===== */
const DIETA_FROM='2026-11-16', DIETA_TO='2026-12-17', DIETA_ALT='2026-11-21';
const DIETA_FASES=[
  {n:1, from:'2026-11-16', to:'2026-11-20', name:'Fase 1 · Ataque',
   note:'Fase de ataque, 5 días de proteína pura. Come tantas veces como quieras y antes de que aparezca el hambre: no hay límite de cantidad, solo de lista.'},
  {n:2, from:'2026-11-21', to:'2026-11-27', name:'Fase 2 · Verduras',
   note:'Entran las verduras, alternando: un día proteína sola y al siguiente verdura con proteína, en comida y en cena.'},
  {n:3, from:'2026-11-28', to:'2026-12-07', name:'Fase 3 · Pan en el desayuno',
   note:'Sigue la alternancia. Los días de verdura, 2 tostadas en el desayuno con mantequilla, mermelada, aceite o pavo.'},
  {n:4, from:'2026-12-08', to:'2026-12-17', name:'Fase 4 · Fruta',
   note:'Último tramo. Los días de verdura, 2 piezas de fruta al día, nunca por la noche.'}
];
function dietaFase(date){
  if(date<DIETA_FROM || date>DIETA_TO) return null;
  const f=DIETA_FASES.find(x=>date>=x.from && date<=x.to);
  if(!f) return null;
  const verdura = f.n>1 && diffDays(DIETA_ALT,date)%2===0;
  return {n:f.n, fase:f.name, note:f.note, verdura, pan:f.n>=3&&verdura, fruta:f.n>=4&&verdura};
}
function dietaMenu(date, df, i){

  const cena='21:15';
  const rows=[];
  rows.push(["07:15","Desayuno",

  notes.push('Cocina con 2-3 cucharadas de aceite para todo el día, no por plato.');
  if(i<4) notes.push('Hoy entrenas fuerza con muy poco hidrato. Si te vienen mareos o se te va la fuerza en la barra, díselo a tu médico antes de cambiar nada por tu cuenta.');
  return {kind:'dieta', name:dia, rows, notes,

}

function dietFor(date, W){
  if(date<START) return null;
  const tr=W.trip[date]; const i=dow(date); const ph=phaseOf(date);
  const notes=[];
  let kind, name;

  if(tr && tr.type==='enfermo') return {kind:'enfermo', name:'Día de recuperación', rows:[], notes:['Hoy no hay déficit ni se cuentan calorías. Come según el hambre, con proteína en cada comida (unos 200 g al día), mucho líquido, caldo, fruta, arroz o patata.']};
  const df=dietaFase(date);
  if(df) return dietaMenu(date, df, i);
  if(ph==='esqui' || (tr && tr.type==='esqui')){ kind='esqui'; name='Día de esquí'; notes.push('Hoy no se pierde peso: se esquía. Comes a mantenimiento o algo por encima. Bebe 2-3 litros aunque no tengas sed: en altura y con frío uno se deshidrata sin enterarse.'); }
  else if(ph==='navidad'){ kind='navidad'; name='Navidad'; notes.push('Semana de mantenimiento. El déficit se pausa y el objetivo es pesar el día 27 lo mismo que el día 20. Proteína en cada comida y el resto, con cabeza.'); }
  else if(tr && tr.type==='vacaciones'){ kind='navidad'; name='Día de vacaciones'; notes.push('Fuera de casa: proteína en cada comida y guarnición del tamaño de tu puño. Los horarios son orientativos.'); }
  else if(tr && tr.type==='trabajo'){ kind='viernes'; name='Día de viaje'; notes.push('En restaurante: proteína a la plancha, arroz o patata y verdura. Los lácteos de la noche, en el hotel si puedes.'); }
  else if(ph==='afinado'){ kind='miercoles'; name='Afinado'; }
  else if(i===5){ kind='evento'; name='Sábado'; notes.push('Hasta las 18:00 llevas unas 1.150 kcal. Si hay evento esta noche, te quedan unas 1.650 de presupuesto, que es una cena de restaurante completa. Si no lo hay, añade arroz o patata en la comida y una cena normal.'); }
  else if(i===4){ kind='viernes'; name='Viernes'; }
  else if(i===6){ kind='domingo'; name='Domingo'; notes.push('El domingo no se compensa el sábado. Nada de ayunar ni de castigarse con cardio: se vuelve al menú y ya está.'); }
  else if(i===2){ kind='miercoles'; name='Miércoles'; }
  else if(i===3){ kind='miercoles'; name='Jueves'; }
  else {
    if(tr && tr.type==='paron'){ kind='miercoles'; name='Día de gimnasio sin cardio'; }
    else { kind='doble'; name='Gimnasio y cardio de tarde'; }
  }

  const PHN={
    bloque1:'Bloque 1: déficit en torno a 900 kcal al día. Proteína alta para que lo que pierdas sea grasa.',
    bloque2:'Bloque 2: mismo déficit. Quedan pocas semanas para Cervinia.',
    afinado:'Afinado: mantén el déficit pero no lo aprietes. Llegas a esquiar, no a pesarte.',
    vuelta:'Vuelta de Cervinia: dos días a mantenimiento, con una ración extra de hidrato en comida y cena. El déficit se reanuda el lunes.',
    reinicio:'Reinicio: déficit suave, unas 600-700 kcal, durante dos semanas mientras vuelve el volumen de entreno.',
    bloque3:'Bloque 3: déficit en torno a 900 kcal y proteína alta. El objetivo son unos 2 kg al mes sin perder fuerza en la barra.',
    semanasanta:'Semana Santa: calorías a mantenimiento, con una ración extra de hidrato en comida y cena. Una semana sin déficit cada tres meses no frena nada y arregla bastante.',
    bloque4:'Bloque 4: déficit en torno a 800 kcal. Hay más volumen en el gimnasio, así que el hidrato se concentra alrededor del entreno.',
    bloque5:'Bloque 5: déficit en torno a 700 kcal con mucho aeróbico encima. Con el calor, 3 litros de agua y sal en las comidas: media parte del peso que baila en la báscula es agua.',
    agosto:'Agosto: mantenimiento. Ni se pierde peso de vacaciones ni se pretende; lo exigente de estas semanas son los simulacros del examen.',
    post:'Déficit en torno a 900 kcal al día.'
  };
  if(PHN[ph] && kind!=='esqui' && kind!=='navidad') notes.unshift(PHN[ph]);

  const rows=dietRows(kind, i).slice();
  return {kind, name, rows, notes};
}
function dietTotals(rows){
  let P=0,C=0,G=0; for(const r of rows){ P+=r[3]; C+=r[4]; G+=r[5]; }
  return {P,C,G,kcal:Math.round((P*4+C*4+G*9)/10)*10};
}

function normalize(s){
  const d=defaultState(); s=s&&typeof s==='object'?s:{};
  const c=(s.cae&&typeof s.cae==='object')?s.cae:{};
  return {v:1, done:s.done||{}, notes:s.notes||{}, weights:s.weights||{}, fixtures:s.fixtures||{},
    cae:{ans:c.ans||{}, graded:c.graded||{}},
    trips:Array.isArray(s.trips)?s.trips:d.trips, settings:Object.assign({},d.settings,s.settings||{})};
}
let state=defaultState();

let docRef=null, writing=false, dirty=false, flushTimer=null, syncMode='local';
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function commit(){ saveLocal(); if(docRef){ dirty=true; clearTimeout(flushTimer); flushTimer=setTimeout(flush,600); } render(); }
async function flush(){
  if(!docRef || !dirty) return;
  if(writing){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,400); return; }
  writing=true; dirty=false;
  try{ await docRef.set(JSON.parse(JSON.stringify(state))); setSync('cloud'); }
  catch(e){
    dirty=true;
    if(e && e.code==='unavailable'){ setTimeout(flush, 2500+Math.random()*1500); }
    else setSync('local');
  }
  writing=false;
  if(dirty){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,400); }
}
function setSync(m){ if(syncMode!==m){ syncMode=m; const el=document.getElementById('syncflag'); if(el) el.outerHTML=syncHTML(); } }
function syncHTML(){ return syncMode==='cloud' ? '<span class="sync cloud" id="syncflag"><i></i>Guardado en tu cuenta</span>' : '<span class="sync" id="syncflag"><i></i>Guardado en este móvil</span>'; }

function skiCountdown(){
  const d=diffDays(TODAY, SKI_FROM);
  if(TODAY>SKI_TO) return null;
  if(d<=0) return {inside:true, day: diffDays(SKI_FROM,TODAY)+1};
  return {inside:false, days:d};
}

const caeNorm = s => String(s==null?'':s).toLowerCase().replace(/[’´`]/g,"'").replace(/[.,;!?]+$/,'').replace(/\s+/g,' ').trim();
function caeOK(q,v){ return q.g ? q.a.some(a=>caeNorm(a)===caeNorm(v)) : (v!=='' && String(v)===String(q.a)); }
function caeScore(n){
  const items=CAE_EX[n]; if(!items) return null;
  return items.filter((q,i)=>caeOK(q, state.cae.ans[n+'-'+i]!=null?state.cae.ans[n+'-'+i]:'')).length;
}
function caeExHTML(n){
  const items=CAE_EX[n];
  if(!items) return '<p class="hint">Los ejercicios de esta semana se añaden cuando lleguemos a ella, según los fallos que arrastres de las anteriores.</p>';
  const graded=!!state.cae.graded[n];
  let h='<div style="margin-top:12px">';
  items.forEach((q,i)=>{
    const key=n+'-'+i;
    const val=state.cae.ans[key]!=null?state.cae.ans[key]:'';
    const ok=caeOK(q,val);
    let inner;
    if(q.g) inner='<div class="cs">'+q.t.replace('______','<input class="cg" data-cae="'+key+'" autocomplete="off" spellcheck="false" value="'+esc(val)+'">')+'</div>';
    else inner='<div class="cs">'+esc(q.t)+'</div><div class="co">'+q.o.map((o,j)=>
      '<label><input type="radio" name="cae'+key+'" data-cae="'+key+'" value="'+j+'"'+(String(val)===String(j)?' checked':'')+'><span>'+'abcd'[j]+') '+esc(o)+'</span></label>').join('')+'</div>';
    if(graded) inner+='<div class="cfb on '+(ok?'y':'n')+'">'+
      (ok?'<b>Correcto.</b> ':'<b>Correcta: '+(q.g?esc(q.a[0]):'abcd'[q.a]+') '+esc(q.o[q.a]))+'.</b> ')+esc(q.e)+'</div>';
    h+='<div class="cq'+(graded?(ok?' y':' n'):'')+'"><div class="cn">'+(i+1)+'</div><div>'+inner+'</div></div>';
  });
  h+='<div style="margin-top:12px;display:flex;align-items:center"><button class="btn small" data-action="caegrade" data-week="'+n+'">'+(graded?'Corregir otra vez':'Corregir')+'</button>'+
     (graded?'<span class="cscore">'+caeScore(n)+' de '+items.length+'</span>':'')+'</div></div>';
  return h;
}

  if(_ph==='semanasanta') h+='<div class="banner warn"><b>Semana Santa.</b> Descarga completa: dos sesiones cortas, actividad libre y calorías a mantenimiento. Una semana así cada tres meses es parte del plan, no una concesión.</div>';
  if(_ph==='bloque4' && weekNum(ui.sel)===21) h+='<div class="banner warn"><b>Bloque 4 · Volumen, ocho semanas.</b> Series de 8-10, el jueves pasa a circuito y el monte del sábado llega a 90 minutos. Es el bloque en el que deberías cruzar los 100 kg hacia abajo.</div>';

  h+=dietHTML(ui.sel, W);

  const groups=[['Entreno',['gym','speed','z2','match','trip'],'var(--c-gym)'],['Estudio',['eng','cera','corr'],'var(--c-corr)'],['Hábitos',['mob','check'],'var(--c-mob)']];

    h+='<div class="srow" style="--c:'+g[2]+'"><span>'+g[0]+'</span><span class="sbar"><i style="width:'+(dn/ts.length*100).toFixed(1)+'%"></i></span><span class="sn">'+dn+'/'+ts.length+'</span></div>';
  }
  const stu=countable.filter(t=>['eng','cera','corr'].includes(t.cat));
  const mins=stu.reduce((a,t)=>a+(parseInt(t.sub)||0),0), minsDone=stu.filter(t=>state.done[t.key]).reduce((a,t)=>a+(parseInt(t.sub)||0),0);
  if(mins) h+='<p class="hint" style="margin:10px 0 0">Estudio: '+(minsDone/60).toFixed(1).replace('.',',')+' h de '+(mins/60).toFixed(1).replace('.',',')+' h hechas.</p>';
  h+='</section>';
  return h;
}

  h+='<section class="section">';
  if(days>0){
    h+='<h3>Faltan '+days+' días</h3><p>'+Math.ceil(days/7)+' semanas hasta el examen'+((wn>=1&&wn<=43)?', y vas por la semana '+wn+' de 43':'')+'. Con tres bloques semanales son unas '+Math.round(Math.ceil(days/7)*2.5)+' horas de inglés por delante.</p>';
  } else h+='<h3>Examen pasado</h3><p>Pon la fecha de la siguiente convocatoria en Ajustes.</p>';
  const c=(wn>=1&&wn<=43)?CAE_W[wn]:null;
  if(c){
    h+='<div class="note" style="padding:10px 12px;border-radius:10px;background:var(--surface-2);margin-top:10px">'+
       '<b>Esta semana: '+esc(c.t)+'.</b> '+esc(c.goal)+'</div>'+
       '<p class="hint">'+esc(c.g)+'. Vocabulario: '+esc(c.v.toLowerCase())+'.</p>';
    const sc=caeScore(wn);
    if(sc!=null && state.cae.graded[wn]) h+='<p>Ejercicios de esta semana: <b>'+sc+' de 12</b>.</p>';
  }
  h+='</section>';

  h+='<section class="section"><h3>Cómo funciona la semana</h3>'+
     '<table class="clock" style="--c:var(--c-eng)">'+
     '<tr><td>Lunes</td><td>Gramática de la semana y doce ejercicios corregibles</td><td>Con la regla explicada en español</td></tr>'+
     '<tr><td>Jueves</td><td>Vocabulario a tarjetas y diez minutos de escucha</td><td>Veinte expresiones, una frase propia en cada una</td></tr>'+
     '<tr><td>Domingo</td><td>Writing cronometrado y Speaking escrito</td><td>Se pegan en el chat para corregir</td></tr>'+
     '</table>'+
     '<p class="hint">Las horas se reparten solas desde Ajustes. Si una semana viajas, el bloque se recoloca como el resto del estudio; si cae en Navidad o en Cervinia, no se programa y no se arrastra.</p></section>';

  h+='<section class="section"><h3>Las fases</h3>';
  for(const [nm,a,b,desc] of CAE_PHASES){
    const past=wn>b, cur=wn>=a&&wn<=b;
    h+='<div class="fix'+(past?' past':'')+(cur?' next':'')+'"><div class="jn">'+(cur?'▶':(past?'✓':'·'))+'</div><div>'+
      '<div class="fr">'+esc(nm)+'</div>'+
      '<div class="fm">Semanas '+a+' a '+b+' · '+esc(shortDate(addDays(START,(a-1)*7)))+' – '+esc(shortDate(addDays(START,(b-1)*7+6)))+'</div>'+
      '<div class="fm">'+esc(desc)+'</div></div></div>';
  }
  h+='</section>';

  h+='<section class="section"><h3>Las 43 semanas</h3>';
  for(let n=1;n<=43;n++){
    const w=CAE_W[n]; if(!w) continue;
    const cls=(n===wn?' cur':(n<wn?' past':''));
    h+='<div class="cweek'+cls+'"><div class="cwn">'+n+'</div><div>'+
       '<div class="cwt">'+esc(w.t)+'</div><div class="cwg">'+esc(shortDate(addDays(START,(n-1)*7)))+' · '+esc(w.g)+'</div></div></div>';
  }
  h+='</section>';

  h+='<section class="section"><h3>Lo que falta por decidir</h3>'+
     '<p>El plan apunta a septiembre de 2027. Si al final te presentas en diciembre, cambia la fecha en Ajustes: son catorce semanas más y las fases se estiran.</p>'+
     '<p>Los ejercicios están cargados hasta la semana 4. Los de cada semana nueva se añaden sobre la marcha, según los fallos que arrastres de las anteriores.</p></section>';
  return h;
}

function viewPeso(){
  let h=pageHead('Peso','Martes, jueves y viernes. Lo que cuenta es la media, no el dato de un día.');
  h+='<section class="section"><h3>Anotar peso</h3><div class="row2"><div class="field"><label for="pd">Día</label><input type="date" id="pd" value="'+TODAY+'"></div><div class="field"><label for="pk">Kilos</label><input type="number" id="pk" inputmode="decimal" step="0.1" min="60" max="160" placeholder="108,4"></div></div><button class="btn full" data-action="addweight">Guardar peso</button></section>';
  const entries=Object.keys(state.weights).sort().map(d=>[d,state.weights[d]]);
  if(!entries.length){ return h+'<section class="section"><p>Todavía no hay pesos. Pésate martes, jueves y viernes de esta primera semana: la media de los tres es tu punto de partida real.</p></section>'; }
  const byWeek={}; for(const [d,w] of entries){ const m=mondayOf(d); (byWeek[m]=byWeek[m]||[]).push(w); }
  const weeks=Object.keys(byWeek).sort().map(m=>({m, avg:byWeek[m].reduce((a,b)=>a+b,0)/byWeek[m].length, n:byWeek[m].length}));
  // gráfico
  const W=320,H=140,P=16; const ws=entries.map(e=>e[1]); const mn=Math.min(...ws)-0.8, mx=Math.max(...ws)+0.8;
  const t0=parse(entries[0][0]).getTime(), t1=Math.max(parse(entries[entries.length-1][0]).getTime(), t0+86400000*7);
  const X=d=>P+(parse(d).getTime()-t0)/(t1-t0)*(W-2*P); const Y=w=>P+(mx-w)/(mx-mn)*(H-2*P);
  const wline=weeks.map(w=>[X(addDays(w.m,3)),Y(w.avg)]);
  h+='<section class="section"><h3>Tendencia</h3><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución del peso">'+
    '<line x1="'+P+'" y1="'+(H-P)+'" x2="'+(W-P)+'" y2="'+(H-P)+'" stroke="var(--line)"/>'+
    entries.map(e=>'<circle cx="'+X(e[0]).toFixed(1)+'" cy="'+Y(e[1]).toFixed(1)+'" r="3" fill="var(--muted)" opacity=".55"/>').join('')+
    (wline.length>1?'<polyline fill="none" stroke="var(--c-gym)" stroke-width="2.5" stroke-linejoin="round" points="'+wline.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>':'')+
    wline.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="var(--c-gym)"/>').join('')+
    '<text x="'+P+'" y="12" font-size="11" fill="var(--muted)">'+fmtKg(mx-0.8)+' kg</text><text x="'+P+'" y="'+(H-3)+'" font-size="11" fill="var(--muted)">'+fmtKg(mn+0.8)+' kg</text>'+
    '</svg><p class="hint">Puntos grises: cada pesaje. Línea verde: media de cada semana.</p>';
  // consejo
  if(weeks.length>=2){
    const a=weeks[weeks.length-1], b=weeks[weeks.length-2]; const dlt=a.avg-b.avg;
    const nav = a.m>='2026-12-21' && a.m<='2026-12-28';
    let msg;
    if(nav) msg='Semana de mantenimiento. Si el peso se ha quedado donde estaba, es exactamente lo que buscábamos.';
    else if(-dlt>1.2) msg='Has bajado '+fmtKg(-dlt)+' kg de media. Es más rápido de lo previsto: si se repite la semana que viene, suma 250 kcal al día. Por encima de 1,2 kg se pierde músculo.';
    else if(-dlt<0.4) msg='Has bajado '+fmtKg(Math.max(0,-dlt))+' kg de media. Si vuelve a quedarse ahí la semana que viene, resta 150-200 kcal del viernes y el domingo. Y revisa los sábados con honestidad.';
    else msg='Has bajado '+fmtKg(-dlt)+' kg de media. Dentro del ritmo del plan (0,7-1,0 kg). No toques nada.';
    h+='<div class="note" style="margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14.5px">'+esc(msg)+'</div>';
  }
  h+='</section><section class="section"><h3>Medias semanales</h3><div class="wlist">';
  weeks.slice().reverse().forEach((w,i,arr)=>{
    const prev=arr[i+1]; const d=prev? w.avg-prev.avg : null;
    h+='<div><span>Semana del '+esc(shortDate(w.m))+' <span class="hint">('+w.n+(w.n===1?' pesaje':' pesajes')+')</span></span><span>'+fmtKg(w.avg)+' kg'+(d!=null?' <span class="'+(d<=0?'good':'bad')+'">'+(d<=0?'−':'+')+fmtKg(Math.abs(d))+'</span>':'')+'</span></div>';
  });
  h+='</div></section><section class="section"><h3>Pesajes</h3><div class="wlist">';
  entries.slice().reverse().slice(0,20).forEach(e=>{ h+='<div><span>'+esc(longDate(e[0]))+'</span><span>'+fmtKg(e[1])+' kg <button class="btn ghost small" data-action="delweight" data-date="'+e[0]+'" aria-label="Borrar pesaje">Borrar</button></span></div>'; });
  h+='</div></section>';
  return h;
}

function viewAjustes(){
  const s=state.settings; const tot=(Number(s.eng)+Number(s.cera)+Number(s.corr))/60;
  let h=pageHead('Ajustes','Horas de estudio por semana. La app las reparte en tus huecos libres, siempre antes de las 22:00.');
  h+='<section class="section"><h3>Estudio semanal</h3>';
  for(const a of ['eng','cera','corr']){
    h+='<div class="field"><label for="s-'+a+'">'+AREA[a].name+', horas por semana</label><input type="number" id="s-'+a+'" data-setting="'+a+'" step="0.5" min="0" max="15" inputmode="decimal" value="'+String(Number(s[a])/60)+'"></div>';
  }
  h+='<p>Total: '+tot.toFixed(1).replace('.',',')+' h a la semana.</p>';
  if(tot>15) h+='<div class="banner warn" style="margin:8px 0 0">Con 10 sesiones de entreno a la semana y en déficit, más de 15 h de estudio te va a quitar sueño. Y el sueño es lo que hace que pierdas grasa y no músculo.</div>';
  h+='<p class="hint">Huecos: lunes y jueves a las 18:15 (inglés), martes a las 18:15 (correduría), miércoles a las 18:30 y viernes a las 19:30 (CERA), sábado a las 12:00 y domingo desde las 15:30. En Navidad y en la semana de esquí no se programa estudio.</p></section>';
  h+='<section class="section"><h3>Exámenes</h3>'+
     '<div class="field"><label for="cd">CERA</label><input type="date" id="cd" data-setting="ceraDate" value="'+esc(s.ceraDate||'')+'"></div>'+
     '<div class="field"><label for="cae-d">C1 Advanced</label><input type="date" id="cae-d" data-setting="caeDate" value="'+esc(s.caeDate||CAE_EXAM)+'"></div>'+
     '<p class="hint">Las dos cuentas atrás aparecen en la pantalla de la semana. Si cambias la convocatoria del C1 a diciembre, las 43 semanas del plan se quedan cortas y sobra margen al final.</p></section>';
  h+='<section class="section"><h3>Copia de seguridad</h3><p>Tus marcas, pesos y viajes se guardan en este móvil. Descarga una copia de vez en cuando, y siempre antes de cambiar de teléfono.</p>'+
    '<button class="btn full" data-action="export">Descargar copia</button>'+
    '<label class="btn ghost full" style="display:grid;place-items:center;margin-top:8px">Recuperar una copia<input type="file" accept=".json,application/json" id="importfile" style="display:none"></label></section>';
  h+='<section class="section"><h3>Empezar de cero</h3><p>Borra todas las tareas marcadas y las notas. Los viajes, pesos y ajustes se quedan.</p>'+
    '<button class="btn danger full" data-action="reset">'+(ui.confirmReset?'Pulsa otra vez para borrar las marcas':'Borrar marcas y notas')+'</button></section>';
  return h;
}

function render(){
  const v=document.getElementById('view');
  const map={semana:viewSemana, viajes:viewViajes, esqui:viewEsqui, ingles:viewIngles, peso:viewPeso, ajustes:viewAjustes};
  v.innerHTML=(map[ui.tab]||viewSemana)();
  const tabs=[['semana','Semana'],['viajes','Viajes'],['esqui','Plan'],['ingles','Inglés'],['peso','Peso'],['ajustes','Ajustes']];
  document.getElementById('tabsin').innerHTML=tabs.map(t=>'<button class="tab'+(ui.tab===t[0]?' on':'')+'" data-action="tab" data-tab="'+t[0]+'" aria-current="'+(ui.tab===t[0]?'page':'false')+'">'+ICONS[t[0]]+'<span>'+t[1]+'</span></button>').join('');
}

/* ================= Eventos ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]'); if(!b) return;
  const a=b.dataset.action;
  if(a==='tab'){ ui.tab=b.dataset.tab; ui.confirmReset=false; ui.tripErr=''; saveUI(); render(); window.scrollTo(0,0); return; }
  if(a==='toggle'){ const k=b.dataset.key; if(state.done[k]) delete state.done[k]; else state.done[k]=1; commit(); return; }
  if(a==='expand'){ const k=b.dataset.key; ui.open[k]=!ui.open[k]; render(); return; }
  if(a==='caegrade'){ const w=b.dataset.week; state.cae.graded[w]=1; commit(); toast('Corregido: '+caeScore(Number(w))+' de 12'); return; }
  if(a==='sel'){ ui.sel=b.dataset.date; render(); return; }
  if(a==='diettoggle'){ ui.dietOpen=!ui.dietOpen; saveUI(); render(); return; }
  if(a==='meal'){ const k=b.dataset.key; if(state.done[k]) delete state.done[k]; else state.done[k]=1; commit(); return; }
  if(a==='week'){ const dir=Number(b.dataset.dir); let n=addDays(mondayOf(ui.sel),7*dir); if(n<mondayOf(START)) n=mondayOf(START); if(n>LAST_WEEK) n=LAST_WEEK; ui.sel = (mondayOf(TODAY)===n && TODAY>=START)?TODAY:(n<START?START:n); render(); return; }
  if(a==='saveweigh'){
    const d=b.dataset.date; const el=document.getElementById('w-'+d); const v=parseFloat(String(el.value).replace(',','.'));
    if(!(v>=60 && v<=160)){ toast('Escribe un peso entre 60 y 160 kg'); return; }
    state.weights[d]=Math.round(v*10)/10; state.done[b.dataset.key]=1; commit(); toast('Peso guardado'); return;
  }
  if(a==='addweight'){
    const d=document.getElementById('pd').value; const v=parseFloat(String(document.getElementById('pk').value).replace(',','.'));
    if(!d){ toast('Elige el día'); return; }
    if(!(v>=60 && v<=160)){ toast('Escribe un peso entre 60 y 160 kg'); return; }
    state.weights[d]=Math.round(v*10)/10; commit(); toast('Peso guardado'); return;
  }
  if(a==='delweight'){ delete state.weights[b.dataset.date]; commit(); return; }
  if(a==='addtrip'){
    const type=document.getElementById('tt').value, from=document.getElementById('tf').value, to=document.getElementById('tto').value, note=document.getElementById('tn').value.trim();
    if(!from||!to){ ui.tripErr='Elige las dos fechas.'; render(); return; }
    if(to<from){ ui.tripErr='La fecha de vuelta es anterior a la de salida.'; render(); return; }
    ui.tripErr='';
    state.trips.push({id:'t'+Date.now().toString(36), type, from, to, note:note.slice(0,60)});
    commit(); toast('Periodo añadido. Agenda replanificada.'); return;
  }
  if(a==='deltrip'){ state.trips=state.trips.filter(t=>t.id!==b.dataset.id); commit(); toast('Periodo quitado'); return; }
  if(a==='export'){
    const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const link=document.createElement('a');
    link.href=url; link.download='temporada-copia-'+TODAY+'.json'; document.body.appendChild(link); link.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); link.remove(); },1000); toast('Copia descargada'); return;
  }
  if(a==='reset'){
    if(!ui.confirmReset){ ui.confirmReset=true; render(); return; }
    state.done={}; state.notes={}; ui.confirmReset=false; commit(); toast('Marcas y notas borradas'); return;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='importfile' && t.files && t.files[0]){
    const r=new FileReader();
    r.onload=()=>{ try{ const data=JSON.parse(r.result); if(!data||typeof data!=='object'||!('done' in data)) throw 0; state=normalize(data); commit(); toast('Copia recuperada'); }catch(err){ toast('Ese archivo no es una copia de la agenda'); } };
    r.readAsText(t.files[0]); return;
  }
  if(t.dataset.cae!=null && t.type==='radio'){ state.cae.ans[t.dataset.cae]=t.value; saveLocal(); if(docRef){dirty=true;clearTimeout(flushTimer);flushTimer=setTimeout(flush,1200);} return; }
  if(t.id==='tt'){ const p=document.getElementById('tdesc'); if(p) p.textContent=TRIP_TYPES[t.value].desc; return; }
  if(t.dataset.setting){
    const k=t.dataset.setting;
    if(k==='ceraDate'||k==='caeDate') state.settings[k]=t.value;
    else { let h=parseFloat(String(t.value).replace(',','.')); if(!(h>=0)) h=0; if(h>15) h=15; state.settings[k]=Math.round(h*60); }
    commit(); return;
  }
});
let noteTimer=null;
document.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset) return;
  if(t.dataset.cae!=null && t.type!=='radio'){
    state.cae.ans[t.dataset.cae]=String(t.value).slice(0,40); saveLocal();
    if(docRef){ dirty=true; clearTimeout(noteTimer); noteTimer=setTimeout(()=>{ clearTimeout(flushTimer); flush(); },1200); }
    return;
  }
  if(!t.dataset.note) return;
  const k=t.dataset.note; const v=t.value.slice(0,500);
  if(v) state.notes[k]=v; else delete state.notes[k];
  saveLocal();
  if(docRef){ dirty=true; clearTimeout(noteTimer); noteTimer=setTimeout(()=>{ clearTimeout(flushTimer); flush(); },1200); }
});

render();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  const now=ymd(new Date());
  if(now!==TODAY){ const wasToday=ui.sel===TODAY; TODAY=now; if(wasToday && now>=START) ui.sel=now; render(); }
});
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
